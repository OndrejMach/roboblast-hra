        messagingSenderId: "29213709911",
        appId: "1:29213709911:web:39caf0f3419d1cee17b512"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ─── Firestore helpers ────────────────────────────────────────────────────
    let fbLevels = [];
    let fbLoading = false;
    let fbError = null;
    let fbLastDoc = null;
    const FB_PAGE = 10;

    async function fbLoadLevels(reset=false) {
        if (fbLoading) return;
        fbLoading = true; fbError = null;
        if (reset) { fbLevels = []; fbLastDoc = null; }
        try {
            let q = db.collection('levels').orderBy('createdAt','desc').limit(FB_PAGE);
            if (fbLastDoc) q = q.startAfter(fbLastDoc);
            const snap = await q.get();
            snap.forEach(doc => fbLevels.push({id:doc.id, ...doc.data()}));
            fbLastDoc = snap.docs[snap.docs.length-1] || fbLastDoc;
        } catch(e) { fbError = 'Chyba načítání: '+e.message; }
        fbLoading = false;
    }

    async function fbUploadLevel(levelData) {
        try {
            const doc = await db.collection('levels').add({
                ...levelData,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                plays: 0
            });
            return doc.id;
        } catch(e) { return null; }
    }

    async function fbIncrementPlays(id) {
        try {
            await db.collection('levels').doc(id).update({
                plays: firebase.firestore.FieldValue.increment(1)
            });
        } catch(e) {}
    }
    </script>

(function(){
    const sz=180, ic=document.createElement('canvas');

        c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);
        c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);
        c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();
    }
    // Background + glow
    c.fillStyle='#000';c.fillRect(0,0,sz,sz);

function drawTutorialOverlay() {
    if (tutorialStep < 0 || tutorialStep >= TUTORIAL_STEPS.length) return;
    const step = TUTORIAL_STEPS[tutorialStep];
    const W = canvas.width;
    const pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.09);

    // Bottom banner
    const bh = 56, by = canvas.height - bh - 4;
    ctx.fillStyle = 'rgba(0,4,18,0.92)';
    ctx.fillRect(4, by, W - 8, bh);
    ctx.strokeStyle = step.color + '99';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(4, by, W - 8, bh);

    // Left accent bar
    ctx.fillStyle = step.color;
    ctx.globalAlpha = 0.6 + 0.4 * pulse;
    ctx.fillRect(4, by, 5, bh);
    ctx.globalAlpha = 1;

    // Step badge
    ctx.shadowBlur = 12 * pulse; ctx.shadowColor = step.color;
    ctx.fillStyle = step.color;
    ctx.textAlign = 'left';
    ctx.font = 'bold 16px "Courier New"';
    ctx.fillText('▸ ' + step.msg, 18, by + 23);
    ctx.shadowBlur = 0;

    // Sub-text
    ctx.fillStyle = '#99bbcc';
    ctx.font = '13px "Courier New"';
    ctx.fillText(step.sub, 18, by + 44);

    // Progress dots (right side)
    const dotsX = W - 14;
    for (let i = TUTORIAL_STEPS.length - 1; i >= 0; i--) {
        const dx = dotsX - (TUTORIAL_STEPS.length - 1 - i) * 18;
        const r = i === tutorialStep ? 5.5 : 3.5;
        ctx.beginPath();
        ctx.arc(dx, by + bh / 2, r, 0, Math.PI * 2);
        ctx.fillStyle = i < tutorialStep ? '#00ff88' : i === tutorialStep ? step.color : '#1a2c36';
        ctx.fill();
        ctx.strokeStyle = i === tutorialStep ? step.color : '#00ffff22';
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    // Skip hint (above banner)
    ctx.textAlign = 'right';
    ctx.font = '10px "Courier New"';
    ctx.fillStyle = '#2a4455';
    ctx.fillText('ESC = přeskočit tutorial', W - 10, by - 5);
}

const isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const leftStick  = { active:false, id:null, bx:0, by:0, dx:0, dy:0, R:82 };
const rightStick = { active:false, id:null, bx:0, by:0, dx:0, dy:0, R:82 };
// Default hint positions (bottom corners)

function toCanvas(cx,cy){
    const r=canvas.getBoundingClientRect();
    return{x:(cx-r.left)*(canvas.width/r.width),y:(cy-r.top)*(canvas.height/r.height)};
}
function clampStick(s){
    const len=Math.sqrt(s.dx*s.dx+s.dy*s.dy);
    if(len>s.R){s.dx=s.dx/len*s.R;s.dy=s.dy/len*s.R;}
}
if(isMobile){
    canvas.addEventListener('touchstart',e=>{
        e.preventDefault();
        for(const t of e.changedTouches){
            const p=toCanvas(t.clientX,t.clientY);
            // Pause toggle strip at top-center
            if(p.y<52&&Math.abs(p.x-canvas.width/2)<100){
                if(state==='playing'){state='paused';pauseSubState=null;}
                else if(state==='paused'&&!pauseSubState){state='playing';}
                continue;
            }
            // Menu/gameover/victory: any tap starts game
            if(state!=='playing'&&state!=='paused'&&state!=='minigame'){startGame();continue;}
            // Pause sub-screens: tap = click
            if(state==='paused'){handlePauseClick(p.x,p.y);continue;}
            if(state==='minigame'){handleMiniGameClick(p.x,p.y);continue;}
            // Playing: left half = move stick, right half = aim stick
            if(p.x<canvas.width/2){
                if(!leftStick.active){
                    // Clamp base: keep away from edges and pause bar
                    const bx=Math.max(70,Math.min(canvas.width/2-60,p.x));
                    const by=Math.max(65,Math.min(canvas.height-60,p.y));
                    Object.assign(leftStick,{active:true,id:t.identifier,bx,by,dx:0,dy:0});
                }
            } else {
                if(!rightStick.active){
                    Object.assign(rightStick,{active:true,id:t.identifier,bx:p.x,by:p.y,dx:0,dy:0});
                    mouse.x=p.x;mouse.y=p.y;
                    handlePlayingClick(p.x,p.y);
                }
            }
        }
    },{passive:false});
    canvas.addEventListener('touchmove',e=>{
        e.preventDefault();
        for(const t of e.changedTouches){
            const p=toCanvas(t.clientX,t.clientY);
            if(leftStick.active&&t.identifier===leftStick.id){
                leftStick.dx=p.x-leftStick.bx;leftStick.dy=p.y-leftStick.by;clampStick(leftStick);
            }
            if(rightStick.active&&t.identifier===rightStick.id){
                mouse.x=p.x;mouse.y=p.y;
            }
        }
    },{passive:false});
    canvas.addEventListener('touchend',e=>{
        e.preventDefault();
        for(const t of e.changedTouches){
            if(leftStick.active&&t.identifier===leftStick.id){leftStick.active=false;leftStick.dx=0;leftStick.dy=0;}
            if(rightStick.active&&t.identifier===rightStick.id){rightStick.active=false;rightStick.dx=0;rightStick.dy=0;keys['mouse']=false;}
        }
    },{passive:false});
    function resizeMobile(){
        const sc=Math.min(window.innerWidth/canvas.width,window.innerHeight/canvas.height);
        canvas.style.width=(canvas.width*sc)+'px';canvas.style.height=(canvas.height*sc)+'px';
    }
    window.addEventListener('resize',resizeMobile);resizeMobile();
}

// ─── Click dispatcher ────────────────────────────────────────────────────────
function handleClick(cx, cy) {
    if      (state === 'minigame')  handleMiniGameClick(cx, cy);
    else if (state === 'paused')    handlePauseClick(cx, cy);
    else if (state === 'quitting')  { /* ignore */ }
    else if (state === 'playing')   handlePlayingClick(cx, cy);
    else if (state === 'community') handleCommunityClick(cx, cy);
    else if (state === 'editor')    handleEditorClick(cx, cy);
    else if (state === 'levelSelect') { handleLevelSelectClick(cx, cy); }
    else {
        // Menu / gameover / victory
        if (state === 'menu') {
            // PLAY button
            const pbx=canvas.width/2-120, pby=canvas.height/2+40, pbw=240, pbh=52;
            if(cx>=pbx&&cx<=pbx+pbw&&cy>=pby&&cy<=pby+pbh){ if(!tutorialSeen){ startTutorialGame(); } else { state='levelSelect'; } return; }
            // COMMUNITY button
            const cbx=canvas.width/2-110, cby=canvas.height/2+106, cbw=220, cbh=36;
            if(cx>=cbx&&cx<=cbx+cbw&&cy>=cby&&cy<=cby+cbh){ state='community'; communityScroll=0; fbLoadLevels(true); return; }
            // OPUSTIT HRU button
            const qbx=canvas.width/2-90, qby=canvas.height/2+152, qbw=180, qbh=30;
            if(cx>=qbx&&cx<=qbx+qbw&&cy>=qby&&cy<=qby+qbh){ if(window.close)window.close(); return; }
        } else {
            // gameover / victory — community or restart
            if(!lastCommunityLevel){
                const cbx=canvas.width/2-110, cby=canvas.height/2+170, cbw=220, cbh=36;
                if(cx>=cbx&&cx<=cbx+cbw&&cy>=cby&&cy<=cby+cbh){ state='community'; communityScroll=0; fbLoadLevels(true); return; }
            }
            if(lastCommunityLevel){ startCommunityLevel(lastCommunityLevel); if(lastEditorTestMode)editorTestMode=true; }
            else { state='levelSelect'; }
        }
    }
}
function activateTransform(){
    if(!transformAvailable||player.transformed)return;
    player.preTransformHp=player.hp;
    player.preTransformMaxHp=player.maxHp;
    player.maxHp=15;player.hp=15;
    player.transformed=true;player.transformTimer=420;
    transformAvailable=false;transformTimer=0;
    for(let i=0;i<30;i++){const a=Math.random()*Math.PI*2;addParticle(player.x,player.y,Math.cos(a)*7,Math.sin(a)*7,'#00ddff',4+Math.random()*3,50);}
    floatingTexts.push({x:player.x,y:player.y-60,text:'TRANSFORMACE!',color:'#00ddff',size:22,life:90,maxLife:90});
}
function handlePlayingClick(cx, cy) {
    // Convert screen X to world X for game-object comparisons (camera may be scrolled)
    const wcx = cx + Math.round(cameraX);
    // Transform button click — this is a screen-space UI element, use cx
    if(transformAvailable && !player.transformed){
        const bx=canvas.width/2-140,bw=280,bh=46;
        if(cx>=bx&&cx<=bx+bw&&cy>=52&&cy<=52+bh){ activateTransform(); return; }
    }
    // Click on a latched fast enemy to kill it instantly (world-space comparison)
    for (const e of enemies) {
        if (!e.latched) continue;
        const ddx=wcx-e.x,ddy=cy-e.y;
        if (Math.sqrt(ddx*ddx+ddy*ddy) < e.size * .9) {
            e.latched=false;e.hp=0;
            explode(e.x,e.y,'#ffee00');
            onEnemyKilled(e.x,e.y,e.type);
            score+=15;
            floatingTexts.push({x:e.x,y:e.y-32,text:'ZÁSAH!',color:'#ffee00',size:19,life:65,maxLife:65});
            return;
        }
    }
    // Struggle: must click ON the player to shake off stuck enemy (world-space)
    const clickOnPlayer = Math.sqrt((wcx-player.x)**2 + (cy-player.y)**2) < 34;
    if (!clickOnPlayer) return;
    for (const e of enemies) {
        if (!e.stuck) continue;
        e.stuckHits = (e.stuckHits || 0) + 1;
        e.flash = 10;
        for (let i = 0; i < 6; i++) {
            const a = Math.random() * Math.PI * 2;
            addParticle(e.x, e.y, Math.cos(a) * 4, Math.sin(a) * 4, '#ff8800', 3, 20);
        }
        if (e.stuckHits >= 3) {
            e.stuck = false;
            const a = Math.atan2(e.y - player.y, e.x - player.x);
            e.x += Math.cos(a) * 110; e.y += Math.sin(a) * 110;
            e.hp = 0;
            explode(e.x, e.y, '#ff8800');
            floatingTexts.push({ x: player.x, y: player.y - 50, text: 'OSVOBOZEN!', color: '#ff8800', size: 18, life: 60, maxLife: 60 });
        }
        return; // one click per frame, hits first stuck enemy
    }
}

// range: [320-130, 320+130+44] = [190, 494]
const PAUSE_BTNS = [
    { label:'POKRAČOVAT',      col:'#00ffff', dy:-130, action:()=>{ state='playing'; pauseSubState=null; } },
    { label:'PRAVIDLA',        col:'#88ffff', dy: -78, action:()=>{ pauseSubState='rules'; } },
    { label:'OBTÍŽNOST',       col:'#aaaaff', dy: -26, action:()=>{ pauseSubState='difficulty'; } },
    { label:'LEVELY HRÁČŮ 🌐', col:'#00ffaa', dy:  26, action:()=>{ communityReturnState='paused'; state='community'; communityScroll=0; fbLoadLevels(true); } },
    { label:'NOVÁ HRA',        col:'#00ffff', dy:  78, action: ()=>{ state='levelSelect'; pauseSubState=null; } },
    { label:'ODEJÍT DO MENU',  col:'#ff2200', dy: 130, action: doQuit },
];
function handlePauseClick(cx, cy) {
    if (pauseSubState === 'rules')       { pauseSubState = null; return; }
    if (pauseSubState === 'difficulty')  { handleDifficultyClick(cx, cy); return; }
    if (pauseSubState === 'diffConfirm') { handleDiffConfirmClick(cx, cy); return; }
    if (pauseSubState === 'codes')       { handleCodesClick(cx, cy); return; }
    if (pauseSubState === 'codeConfirm') { handleCodeConfirmClick(cx, cy); return; }
    const bx = pauseBtnX(), cy0 = canvas.height/2+20;
    for (const btn of PAUSE_BTNS) {
        const by = cy0 + btn.dy;
        if (cx>=bx && cx<=bx+PAUSE_BTN_W && cy>=by && cy<=by+PAUSE_BTN_H) { btn.action(); return; }
    }
    // CODES button (bottom-left corner)
    const cbx=18, cby=canvas.height-44, cbw=90, cbh=28;
    if (cx>=cbx && cx<=cbx+cbw && cy>=cby && cy<=cby+cbh) { codeInput=''; pauseSubState='codes'; return; }
}
function handleDifficultyClick(cx, cy) {
    const diffs=['easy','medium','hard'], bw=190,bh=90,gap=28;
    const startX=canvas.width/2-(3*bw+2*gap)/2, by=canvas.height/2-45;
    for(let i=0;i<3;i++){
        const bx=startX+i*(bw+gap);
        if(cx>=bx&&cx<=bx+bw&&cy>=by&&cy<=by+bh){
            if(diffs[i]===difficulty){ pauseSubState='difficulty'; return; }
            pendingDifficulty=diffs[i]; pauseSubState='diffConfirm'; return;
        }
    }
}
function handleDiffConfirmClick(cx, cy) {
    const bw=155,bh=46,by=canvas.height/2+50;
    if(cx>=canvas.width/2-bw-16&&cx<=canvas.width/2-16&&cy>=by&&cy<=by+bh){ difficulty=pendingDifficulty; pauseSubState=null; state='levelSelect'; return; }
    if(cx>=canvas.width/2+16&&cx<=canvas.width/2+16+bw&&cy>=by&&cy<=by+bh){ pauseSubState='difficulty'; pendingDifficulty=null; return; }
}
function doQuit() { state = 'quitting'; quitTimer = 0; setTimeout(()=>{ state='menu'; },1800); }

// ─── Player / entities ───────────────────────────────────────────────────────
let player, bullets, enemies, particles, powerups, boss, shootCooldown;

function startGame() {
    currentLevelId = 'classic'; // default; overridden by startCommunityLevel/startBuiltinLevel
    state = 'playing'; pauseSubState = null; editorTestMode = false; lastEditorTestMode = false;
    gravityMode = false; playerVy = 0; playerOnGround = false; cameraX = 0; prevPlayerX = 0; editorMapScrollCol = 0;
    lastCommunityLevel = null;
    score = 0; wave = 1; frameCount = 0;
    killCount = 0; mapKills = 0; mapLevel = 0;
    mapTransition = 0; stormKillTracker = 0;
    bullets = []; enemies = []; particles = []; powerups = [];
    boss = null; miniGame = null; shootCooldown = 0; floatingTexts = [];
    transformAvailable = false; transformTimer = 0; shooterKillCount = 0;
    cheatGodmode = false; cheatStrong = false; cheatUltraRobot = false; cheatInfinite = false;
    communityLevel = null; obstacles = []; communityWave = 0;
    communitySpawnQueue = []; communitySpawnTimer = 0; communityWaveClear = false; communityWavePause = 0;
    player = { x:canvas.width/2, y:canvas.height/2, speed:4, hp:5, maxHp:5,
               angle:0, invincible:0, activeUpgrade:null, upgradeTimer:0, shieldHits:0,
               transformed:false, transformTimer:0, preTransformHp:5, preTransformMaxHp:5 };
}

// ─── Community level play ────────────────────────────────────────────────────
function startCommunityLevel(lv){
    if(lv.basicMode){startGame(); currentLevelId=lv.id; return;}
    startGame();
    currentLevelId=lv.id; // override after startGame set it to 'classic'
    lastCommunityLevel=lv; communityLevel=lv;
    mapLevel=0; // always start from sector 1 — mapTheme is only for editor visuals
    obstacles=(lv.obstacles||[]).map(o=>({x:o.col*50,y:o.row*50,w:50,h:50,type:o.type||'wall'}));
    gravityMode=!!(lv.gravity);
    cameraX=0; prevPlayerX=0;
    // Apply player spawn point if set
    if(lv.playerSpawn){
        player.x=lv.playerSpawn.col*CELL+CELL/2;
        player.y=lv.playerSpawn.row*CELL+CELL/2;
    } else if(gravityMode){
        player.x=CELL*1.5; player.y=canvas.height-22;
    }
    if(gravityMode){ playerVy=0; playerOnGround=false; }
    startCommunityWave(0);
    if(lv.id&&!lv.id.startsWith('b')&&!lv.id.startsWith('test'))fbIncrementPlays(lv.id).catch(()=>{});
}
function startBuiltinLevel(lv){
    if(!lv)return;
    if(lv.basicMode){startGame(); currentLevelId=lv.id; return;}
    startCommunityLevel(lv); // sets currentLevelId = lv.id inside
}

function startCommunityWave(wIdx){
    if(!communityLevel)return;
    if(wIdx>=communityLevel.waves.length){
        state='victory'; return;
    }
    communityWave=wIdx; communityWaveClear=false;
    const wave=communityLevel.waves[wIdx];
    communitySpawnQueue=[];
    for(const eg of (wave.enemies||[])){
        for(let i=0;i<(eg.count||0);i++) communitySpawnQueue.push(eg.type);
    }
    // Shuffle queue
    for(let i=communitySpawnQueue.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [communitySpawnQueue[i],communitySpawnQueue[j]]=[communitySpawnQueue[j],communitySpawnQueue[i]];
    }
    communitySpawnTimer=0; communityWavePause=0;
    floatingTexts.push({x:canvas.width/2,y:canvas.height/2-50,
        text:`⚡ VLNA ${wIdx+1} / ${communityLevel.waves.length}`,
        color:'#00ffaa',size:24,life:100,maxLife:100});
}

// ─── Shoot ───────────────────────────────────────────────────────────────────
function shoot() {
    // Transformed shooter form: twin parallel cyan bullets
    if(player.transformed){
        if(shootCooldown>0)return;
        shootCooldown=60; // same rate as shooter enemy
        const a=Math.atan2(mouse.y-player.y,(mouse.x+cameraX)-player.x);
        for(const off of[-0.08,0.08]){
            bullets.push({x:player.x+Math.cos(a)*24,y:player.y+Math.sin(a)*24,
                vx:Math.cos(a+off)*4.5,vy:Math.sin(a+off)*4.5,life:140,fromPlayer:true,size:6,dmg:999,pierce:false,color:'#00ddff'});
        }
        for(let i=0;i<8;i++)addParticle(player.x+Math.cos(a)*28,player.y+Math.sin(a)*28,
            Math.cos(a+(Math.random()-.5))*3,Math.sin(a+(Math.random()-.5))*3,'#00ddff',3+Math.random()*2,20);
        return;
    }
    const up = player.activeUpgrade;
    const cd = up==='storm'?3 : up==='rapid'?4 : 10;
    if (shootCooldown > 0) return;
    shootCooldown = cd;
    const a = Math.atan2(mouse.y-player.y, (mouse.x+cameraX)-player.x);

    if (up === 'storm') {
        for (let i=-2; i<=2; i++) {
            const ang = a + i*0.2;
            const zz = Array.from({length:6}, ()=>(Math.random()-.5)*10);
            bullets.push({x:player.x+Math.cos(ang)*28, y:player.y+Math.sin(ang)*28,
                vx:Math.cos(ang)*14, vy:Math.sin(ang)*14, life:70, fromPlayer:true,
                size:4, dmg:1, pierce:false, color:'#ffff44', lightning:true, zigzag:zz});
        }
        for (let i=0;i<8;i++) addParticle(player.x+Math.cos(a)*32, player.y+Math.sin(a)*32,
            Math.cos(a+(Math.random()-.5))*6, Math.sin(a+(Math.random()-.5))*6, '#ffff88', 2+Math.random()*3, 14);
        return;
    }
    // Ultra Robot: always shoot storm-style
    if (cheatUltraRobot) {
        for (let i=-2; i<=2; i++) {
            const ang = a + i*0.2;
            const zz = Array.from({length:6}, ()=>(Math.random()-.5)*10);
            bullets.push({x:player.x+Math.cos(ang)*28, y:player.y+Math.sin(ang)*28,
                vx:Math.cos(ang)*14, vy:Math.sin(ang)*14, life:70, fromPlayer:true,
                size:4, dmg:999, pierce:false, color:'#ffff44', lightning:true, zigzag:zz});
        }
        for (let i=0;i<8;i++) addParticle(player.x+Math.cos(a)*32, player.y+Math.sin(a)*32,
            Math.cos(a+(Math.random()-.5))*6, Math.sin(a+(Math.random()-.5))*6, '#ffff88', 2+Math.random()*3, 14);
        return;
    }
    const size=up==='big'?10:up==='power'?6:4, spd=up==='big'?8:11;
    const dmg=cheatStrong?999:up==='power'||up==='big'?2:1, pierce=up==='big'||cheatStrong;
    const col=up==='power'?'#ff4400':up==='big'?'#cc00ff':up==='rapid'?'#ffaa00':up==='triple'?'#00ff88':cheatStrong?'#ff8800':'#00ffff';
    const angles=up==='triple'?[a-0.22,a,a+0.22]:[a];
    for (const ang of angles) {
        bullets.push({x:player.x+Math.cos(ang)*22, y:player.y+Math.sin(ang)*22,
            vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, life:90, fromPlayer:true, size, dmg, pierce, color:col});
    }
    for (let i=0;i<6;i++) addParticle(player.x+Math.cos(a)*26, player.y+Math.sin(a)*26,
        Math.cos(a+(Math.random()-.5))*(3+Math.random()*4), Math.sin(a+(Math.random()-.5))*(3+Math.random()*4), col, 2+Math.random()*3, 18);
}

function addParticle(x,y,vx,vy,color,size,life) { particles.push({x,y,vx,vy,color,size,life,maxLife:life}); }
// Returns true if player died
function shieldOrDamage(col){
    if(cheatGodmode) return false;
    if(player.shieldHits>0){
        player.shieldHits--;player.invincible=35;
        for(let i=0;i<14;i++){const a=Math.random()*Math.PI*2;addParticle(player.x,player.y,Math.cos(a)*5,Math.sin(a)*5,'#ffd700',3+Math.random()*2,28);}
        const msg=player.shieldHits===0?'ŠTÍT ZNIČEN!':(`ŠTÍT: ${player.shieldHits}`);
        floatingTexts.push({x:player.x,y:player.y-55,text:msg,color:'#ffd700',size:16,life:55,maxLife:55});
        return false;
    }
    player.hp--;if(col)explode(player.x,player.y,col);
    if(player.hp<=0){
        if(player.transformed){revertTransform();return false;}
        return true;
    }
    return false;
}
function revertTransform(){
    player.transformed=false;player.transformTimer=0;
    player.hp=Math.min(player.preTransformHp,player.preTransformMaxHp);
    player.maxHp=player.preTransformMaxHp;
    for(let i=0;i<24;i++){const a=Math.random()*Math.PI*2;addParticle(player.x,player.y,Math.cos(a)*6,Math.sin(a)*6,'#00ddff',3+Math.random()*3,45);}
    floatingTexts.push({x:player.x,y:player.y-65,text:'FORMA SKONČILA!',color:'#44ddff',size:17,life:80,maxLife:80});
}

// ─── Spawning ────────────────────────────────────────────────────────────────
const ENEMY_STATS={basic:{hp:2,speed:2,size:30},fast:{hp:1,speed:3.8,size:24},tank:{hp:5,speed:1.2,size:42},shooter:{hp:7,speed:1.1,size:46}};
function spawnEnemy(forcedType) {
    let x,y;
    // Use custom spawn points if defined in the level
    const sps=communityLevel&&(communityLevel.spawnPoints||[]).filter(sp=>{
        const wx=sp.col*CELL+CELL/2;
        return wx>=cameraX-CELL&&wx<=cameraX+canvas.width+CELL;
    });
    if(sps&&sps.length>0){
        const sp=sps[Math.floor(Math.random()*sps.length)];
        x=sp.col*CELL+CELL/2+(Math.random()-0.5)*30;
        y=sp.row*CELL+CELL/2+(Math.random()-0.5)*30;
    } else {
        const side=Math.floor(Math.random()*4);
        const _lvW=(communityLevel?(communityLevel.mapCols||GCOLS):GCOLS)*CELL;
        if(gravityMode&&_lvW>canvas.width){
            x=cameraX+canvas.width+35+Math.random()*80;
            y=canvas.height*0.1+Math.random()*(canvas.height*0.75);
        } else if(side===0){x=cameraX+Math.random()*canvas.width;y=-35;}
        else if(side===1){x=cameraX+canvas.width+35;y=Math.random()*canvas.height;}
        else if(side===2){x=cameraX+Math.random()*canvas.width;y=canvas.height+35;}
        else{x=cameraX-35;y=Math.random()*canvas.height;}
    }
    const r=Math.random();
    const type=forcedType||(r<0.52?'basic':r<0.72?'fast':r<0.88?'tank':'shooter');
    const s=ENEMY_STATS[type]||ENEMY_STATS.basic;
    enemies.push({x,y,size:s.size,hp:s.hp,maxHp:s.hp,speed:s.speed,type,angle:0,flash:0,shootTimer:Math.floor(Math.random()*60)});
}
function spawnBoss() {
    const mega=mapLevel===10;
    boss={x:canvas.width/2,y:mega?120:100,size:mega?130:90,hp:mega?280:80,maxHp:mega?280:80,
          speed:mega?1.6:1.1,angle:0,flash:0,shootTimer:0,spawnTimer:0,mega};
}
function tryDropPowerup(x,y) {
    if (powerups.filter(p=>p.type!=='heal').length>=5) return;
    if (Math.random()>0.19) return;
    const busy = player.activeUpgrade || player.transformed;
    // Shield: separate rare drop (7%), not in main pool
    if (!busy && Math.random()<0.07) {
        powerups.push({x,y,type:'shield',life:360,maxLife:360,spin:0}); return;
    }
    const pool = busy ? ['rapid','big'] : REGULAR_UPGRADES;
    const type = pool[Math.floor(Math.random()*pool.length)];
    powerups.push({x,y,type,life:360,maxLife:360,spin:0});
}
function onEnemyKilled(x,y,type) {
    killCount++; mapKills++;
    const inPowerForm = player.transformed || player.activeUpgrade === 'storm';
    if (!inPowerForm) {
        // Storm counter and tank counter only count in normal form
        stormKillTracker++;
        if (stormKillTracker>=STORM_EVERY) {
            stormKillTracker=0;
            powerups.push({x,y,type:'storm',life:420,maxLife:420,spin:0});
        } else { tryDropPowerup(x,y); }
        // Tank kill counter for transform (3 needed, resets after unlock)
        if (type==='shooter') {
            shooterKillCount++;
            floatingTexts.push({x,y:y-22,text:`SHOOTER ${shooterKillCount}/3`,color:'#00ddff',size:15,life:50,maxLife:50});
            if (shooterKillCount>=3 && !transformAvailable) {
                shooterKillCount=0; transformAvailable=true; transformTimer=900;
                floatingTexts.push({x:player.x,y:player.y-55,text:'TRANSFORMACE — stiskni T!',color:'#00ddff',size:18,life:110,maxLife:110});
                for(let i=0;i<20;i++){const a=Math.random()*Math.PI*2;addParticle(player.x,player.y,Math.cos(a)*6,Math.sin(a)*6,'#00ddff',3+Math.random()*2,40);}
            }
        }
    } else {
        // In power form: still drop items but nothing counts toward meters
        tryDropPowerup(x,y);
    }
    // Heal drop — always, regardless of transform
    if (Math.random()<0.18) {
        powerups.push({x:x+(Math.random()-.5)*24,y:y+(Math.random()-.5)*24,type:'heal',life:300,maxLife:300,spin:0});
    }
    if (!cheatInfinite && mapLevel<10 && mapKills>=KILLS_PER_MAP) {
        mapKills=0; mapLevel++;
        mapTransition=90;
        player.hp = player.maxHp;
        floatingTexts.push({x:player.x, y:player.y-50, text:'HP RESTORED!', color:'#00ff44', size:18, life:70, maxLife:70});
        if (mapLevel===10) { mapTransitionText='MEGA-BOSS INCOMING!'; spawnBoss(); }
        else { mapTransitionText=MAP_THEMES[mapLevel].name; }
    } else if (cheatInfinite && mapKills>=KILLS_PER_MAP) {
        mapKills=0; // reset kill counter but stay on sector 1
        floatingTexts.push({x:player.x,y:player.y-50,text:'∞ INFINITE MODE',color:'#ff00ff',size:16,life:60,maxLife:60});
    }
}

// ─── Mini-game ────────────────────────────────────────────────────────────────
function startMiniGame() {
    // Generate 5 well-spaced nodes
    const nodes=[], minDist=130;
    let tries=0;
    while (nodes.length<5 && tries<300) {
        tries++;
        const nx=100+Math.random()*(canvas.width-200);
        const ny=130+Math.random()*(canvas.height-230);
        let ok=true;
        for (const n of nodes) { const dx=n.x-nx,dy=n.y-ny; if(Math.sqrt(dx*dx+dy*dy)<minDist){ok=false;break;} }
        if (ok) nodes.push({x:nx,y:ny,order:nodes.length+1,clicked:false});
    }
    while (nodes.length<5) nodes.push({x:100+Math.random()*(canvas.width-200), y:130+Math.random()*(canvas.height-230), order:nodes.length+1, clicked:false});

    miniGame={nodes, nextTarget:1, timeLeft:420, arcs:[], completed:false, failed:false, resultTimer:0};
    state='minigame';
}

function handleMiniGameClick(cx,cy) {
    if (!miniGame||miniGame.completed||miniGame.failed) return;
    const target=miniGame.nodes.find(n=>n.order===miniGame.nextTarget&&!n.clicked);
    if (!target) return;
    const dx=cx-target.x, dy=cy-target.y;
    if (Math.sqrt(dx*dx+dy*dy)<32) {
        target.clicked=true;
        if (miniGame.nextTarget>1) {
            const prev=miniGame.nodes.find(n=>n.order===miniGame.nextTarget-1);
            const segs=8;
            const adx=target.x-prev.x, ady=target.y-prev.y;
            const dist=Math.sqrt(adx*adx+ady*ady)||1;
            const zz=Array.from({length:segs-1},()=>(Math.random()-.5)*22);
            miniGame.arcs.push({x1:prev.x,y1:prev.y,x2:target.x,y2:target.y,zigzag:zz,perpX:-ady/dist,perpY:adx/dist});
        }
        miniGame.nextTarget++;
        if (miniGame.nextTarget>5) { miniGame.completed=true; miniGame.resultTimer=90; }
    }
}

function updateMiniGame() {
    if (!miniGame) return;
    if (miniGame.completed||miniGame.failed) {
        miniGame.resultTimer--;
        if (miniGame.resultTimer<=0) {
            if (miniGame.completed) {
                player.activeUpgrade='storm'; player.upgradeTimer=STORM_DURATION;
                // Storm costs half max HP
                player.preStormHp=player.hp; player.preStormMaxHp=player.maxHp;
                player.maxHp=Math.max(1,Math.floor(player.maxHp/2));
                player.hp=Math.min(player.hp,player.maxHp);
                floatingTexts.push({x:player.x,y:player.y-60,text:`MAX HP: ${player.maxHp}`,color:'#ffff00',size:17,life:90,maxLife:90});
                explode(canvas.width/2,canvas.height/2,'#ffff00');
            }
            miniGame=null; state='playing';
        }
        return;
    }
    miniGame.timeLeft--;
    if (miniGame.timeLeft<=0) { miniGame.failed=true; miniGame.resultTimer=90; }
}

function drawMiniGame() {
    if (!miniGame) return;
    ctx.fillStyle='rgba(0,4,18,0.9)'; ctx.fillRect(0,0,canvas.width,canvas.height);

    // Title
    ctx.textAlign='center';
    ctx.font='bold 28px "Courier New"';
    ctx.shadowBlur=22; ctx.shadowColor='#ffff00'; ctx.fillStyle='#ffff00';
    ctx.fillText('⚡  BLESKOVÁ KALIBRACE  ⚡', canvas.width/2, 50);
    ctx.shadowBlur=0;
    ctx.font='14px "Courier New"'; ctx.fillStyle='#aaffff';
    ctx.fillText('Klikej uzly v pořadí — 1  →  2  →  3  →  4  →  5', canvas.width/2, 76);

    // Timer bar
    const pct=miniGame.timeLeft/420;
    const tbx=80, tbw=canvas.width-160, tby=92, tbh=10;
    const tcol=pct>0.5?'#00ff88':pct>0.25?'#ffaa00':'#ff2200';
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(tbx,tby,tbw,tbh);
    ctx.shadowBlur=8; ctx.shadowColor=tcol; ctx.fillStyle=tcol; ctx.fillRect(tbx,tby,tbw*pct,tbh);
    ctx.shadowBlur=0; ctx.strokeStyle='#223'; ctx.lineWidth=1; ctx.strokeRect(tbx,tby,tbw,tbh);
    ctx.textAlign='right'; ctx.font='11px "Courier New"'; ctx.fillStyle=tcol;
    ctx.fillText(`${(miniGame.timeLeft/60).toFixed(1)}s`, tbx+tbw, tby+tbh+13);

    // Progress
    ctx.textAlign='left'; ctx.font='bold 13px "Courier New"'; ctx.fillStyle='#ffff88';
    ctx.fillText(`${miniGame.nextTarget-1}/5 uzlů`, tbx, tby+tbh+13);

    // Arcs between completed nodes
    for (const arc of miniGame.arcs) drawLightningArc(arc);

    // Nodes
    for (const node of miniGame.nodes) {
        const isCur=node.order===miniGame.nextTarget&&!node.clicked;
        const isDone=node.clicked;
        const pulse=0.6+0.4*Math.sin(frameCount*0.15);
        const col=isDone?'#ffff00':isCur?'#00ffff':'#2a3a4a';
        const r=isDone?17:isCur?17:13;

        ctx.save();
        ctx.shadowBlur=isCur?25*pulse:isDone?14:4; ctx.shadowColor=col;

        // Outer ring (current target pulses bigger)
        ctx.strokeStyle=col; ctx.lineWidth=isCur?3:2;
        ctx.beginPath(); ctx.arc(node.x,node.y,r+(isCur?4*pulse:0),0,Math.PI*2); ctx.stroke();

        // Fill
        ctx.fillStyle=isDone?'#1a1a00':isCur?'#001a22':'#060e14';
        ctx.beginPath(); ctx.arc(node.x,node.y,r,0,Math.PI*2); ctx.fill();

        // Number
        ctx.fillStyle=isDone?'#ffff00':isCur?'#00ffff':'#445566';
        ctx.font=`bold 14px "Courier New"`; ctx.textAlign='center';
        ctx.fillText(node.order,node.x,node.y+5);

        // Arrow above current
        if (isCur) {
            const ad=35+5*pulse;
            ctx.fillStyle='#00ffff';
            ctx.beginPath(); ctx.moveTo(node.x,node.y-ad); ctx.lineTo(node.x-8,node.y-ad-12); ctx.lineTo(node.x+8,node.y-ad-12); ctx.closePath(); ctx.fill();
        }

        // Checkmark on done
        if (isDone) {
            ctx.strokeStyle='#ffff00'; ctx.lineWidth=2;
            ctx.beginPath(); ctx.moveTo(node.x-5,node.y); ctx.lineTo(node.x-1,node.y+5); ctx.lineTo(node.x+6,node.y-5); ctx.stroke();
        }

        ctx.shadowBlur=0; ctx.restore();
    }

    // ESC hint

function drawLightningArc(arc) {
    const {x1,y1,x2,y2,zigzag,perpX,perpY}=arc;
    const segs=zigzag.length+1;
    const dx=x2-x1, dy=y2-y1;
    ctx.save();
    // Glow pass
    ctx.shadowBlur=18; ctx.shadowColor='#ffff00';
    ctx.strokeStyle='#ffffaa'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(x1,y1);
    for (let i=1;i<=segs;i++) {
        const t=i/segs;
        let px=x1+dx*t, py=y1+dy*t;
        if (i<segs){ px+=perpX*zigzag[i-1]; py+=perpY*zigzag[i-1]; }
        ctx.lineTo(px,py);
    }
    ctx.stroke();
    // Bright core
    ctx.shadowBlur=0; ctx.strokeStyle='#ffffff'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x1,y1);
    for (let i=1;i<=segs;i++) {
        const t=i/segs; let px=x1+dx*t,py=y1+dy*t;
        if(i<segs){px+=perpX*zigzag[i-1]*0.5;py+=perpY*zigzag[i-1]*0.5;}
        ctx.lineTo(px,py);
    }
    ctx.stroke();
    // Endpoint dots
    ctx.fillStyle='#ffff00';
    ctx.beginPath();ctx.arc(x1,y1,4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x2,y2,4,0,Math.PI*2);ctx.fill();
    ctx.restore();
}

function roundRect(x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
    ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

function drawBackground(camX=0){
    const theme=MAP_THEMES[Math.min(mapLevel,MAP_THEMES.length-1)];
    const sky=ctx.createLinearGradient(0,0,0,canvas.height*0.65);
    sky.addColorStop(0,theme.sky[0]);sky.addColorStop(0.6,theme.sky[1]);sky.addColorStop(1,theme.sky[2]);
    ctx.fillStyle=sky;ctx.fillRect(0,0,canvas.width,canvas.height*0.65);
    const gnd=ctx.createLinearGradient(0,canvas.height*0.65,0,canvas.height);
    gnd.addColorStop(0,theme.gnd[0]);gnd.addColorStop(1,theme.gnd[1]);
    ctx.fillStyle=gnd;ctx.fillRect(0,canvas.height*0.65,canvas.width,canvas.height*0.35);
    ctx.strokeStyle=theme.grid;ctx.lineWidth=1;
    const gridOff=camX%45;
    for(let gx=-gridOff;gx<=canvas.width;gx+=45){ctx.beginPath();ctx.moveTo(gx,canvas.height*.65);ctx.lineTo(gx,canvas.height);ctx.stroke();}
    for(let gy=canvas.height*.65;gy<canvas.height;gy+=35){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(canvas.width,gy);ctx.stroke();}
    const parOff=Math.round(camX*0.5)%canvas.width;
    for(const b of buildings){
        const hue=theme.hues[b.hueIndex];
        for(let tile=-1;tile<=1;tile++){
            const bx=b.x-parOff+tile*canvas.width;
            if(bx+b.w<0||bx>canvas.width)continue;
            ctx.fillStyle=`hsl(${hue},25%,7%)`;ctx.fillRect(bx,b.y,b.w,b.h);
            ctx.strokeStyle=`hsla(${hue},80%,55%,0.45)`;ctx.lineWidth=1;ctx.strokeRect(bx,b.y,b.w,b.h);
            ctx.strokeStyle=`hsla(${hue},100%,65%,0.6)`;ctx.lineWidth=1.5;
            ctx.beginPath();ctx.moveTo(bx+b.w/2,b.y);ctx.lineTo(bx+b.w/2,b.y-14);ctx.stroke();
            ctx.fillStyle=`hsl(${hue+30},100%,70%)`;ctx.beginPath();ctx.arc(bx+b.w/2,b.y-14,2.5,0,Math.PI*2);ctx.fill();
            for(const w of b.wins){
                const lit=w.on&&!(w.blink&&Math.floor(frameCount/40)%2===0);
                if(lit){ctx.shadowBlur=4;ctx.shadowColor=`hsl(${hue+20},100%,70%)`;ctx.fillStyle=`hsla(${hue+20},100%,78%,0.75)`;ctx.fillRect(bx+(w.x-b.x),w.y,9,11);ctx.shadowBlur=0;}
            }
        }
    }
    ctx.fillStyle='rgba(0,0,0,0.04)';for(let sy=0;sy<canvas.height;sy+=4)ctx.fillRect(0,sy,canvas.width,2);
}

function drawEnemy(e){
    ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.angle);
    const fl=e.flash>0&&Math.floor(e.flash/2)%2===0;
    const col={basic:'#ff0088',fast:'#ffee00',tank:'#ff4400',shooter:'#00ddff'},dark={basic:'#280016',fast:'#282000',tank:'#280a00',shooter:'#001a22'};
    const c=col[e.type],s=e.size/2;

    // Shooter: draw gun barrels BEHIND body so they appear as part of it
    if(e.type==='shooter'){
        const charging=e.shootTimer>45;
        const chargeGlow=charging?(e.shootTimer-45)/15:0;
        ctx.fillStyle='#001a22';ctx.strokeStyle=fl?'#fff':c;ctx.lineWidth=2;
        // Top barrel
        ctx.fillRect(s*.3,-s*.7,s*1.1,s*.35);ctx.strokeRect(s*.3,-s*.7,s*1.1,s*.35);

        ctx.fillRect(s*.3,s*.35,s*1.1,s*.35);ctx.strokeRect(s*.3,s*.35,s*1.1,s*.35);

        if(charging){

            ctx.beginPath();ctx.arc(s*1.4,-s*.52,4,0,Math.PI*2);ctx.fill();

            ctx.globalAlpha=1;ctx.shadowBlur=0;
        }
    }

    ctx.fillStyle=dark[e.type];ctx.strokeStyle=fl?'#fff':c;ctx.lineWidth=2;ctx.shadowBlur=fl?0:8;ctx.shadowColor=c;
    if(e.type==='shooter'){
        // Square boxy body
        ctx.fillRect(-s,-s,s*2,s*2);ctx.strokeRect(-s,-s,s*2,s*2);
        // Corner bolts
        ctx.shadowBlur=0;ctx.fillStyle=c;ctx.globalAlpha=0.5;
        for(const [bx,by] of [[-s+4,-s+4],[s-4,-s+4],[-s+4,s-4],[s-4,s-4]]){ctx.beginPath();ctx.arc(bx,by,3,0,Math.PI*2);ctx.fill();}

    ctx.shadowBlur=0;

    // Eyes
    ctx.fillStyle='#ff0000';ctx.shadowBlur=8;ctx.shadowColor='#ff0000';
    if(e.type==='tank'){ctx.fillRect(-s*.65,-s*.55,s*.5,5);ctx.fillRect(s*.15,-s*.55,s*.5,5);}

    ctx.shadowBlur=0;ctx.fillStyle=c;ctx.globalAlpha=0.45;ctx.beginPath();ctx.arc(0,0,s*.32,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;

        const pulse=0.5+0.5*Math.sin(Date.now()*.015);

    const c=['','#ff2200','#ff8800','#ffee00'][phase],fl=boss.flash>0&&Math.floor(boss.flash/2)%2===0;
    const s=boss.size/2,eyePulse=0.6+0.4*Math.sin(frameCount*.18);
    ctx.save();ctx.translate(boss.x,boss.y);ctx.rotate(boss.angle);
    for(let ring=0;ring<2;ring++){ctx.strokeStyle=c;ctx.lineWidth=2;ctx.globalAlpha=0.12+0.08*Math.sin(frameCount*.08+ring*1.5);ctx.shadowBlur=25;ctx.shadowColor=c;ctx.beginPath();ctx.arc(0,0,s*(1.5+ring*.3),0,Math.PI*2);ctx.stroke();}
    ctx.globalAlpha=1;ctx.shadowBlur=0;
    ctx.fillStyle='#1a0000';ctx.strokeStyle=c;ctx.lineWidth=2;
    {const arms=boss.mega?6:4;for(let i=0;i<arms;i++){ctx.save();ctx.rotate(i*(Math.PI*2/arms)+frameCount*(boss.mega?.007:.005));ctx.fillRect(s*.7,-9,s*(boss.mega?.95:.8),18);ctx.strokeRect(s*.7,-9,s*(boss.mega?.95:.8),18);ctx.fillStyle='#333';ctx.fillRect(s*1.5,-6,s*.4,12);ctx.strokeRect(s*1.5,-6,s*.4,12);if(boss.mega){ctx.fillStyle='#ff2200';ctx.globalAlpha=0.5+0.3*Math.sin(frameCount*.1+i);ctx.beginPath();ctx.arc(s*1.7,0,5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}ctx.restore();}}
    ctx.fillStyle='#1a0000';ctx.strokeStyle=fl?'#ffffff':c;ctx.lineWidth=3;ctx.shadowBlur=fl?0:18;ctx.shadowColor=c;
    ctx.beginPath();for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2-Math.PI/6;ctx.lineTo(Math.cos(a)*s,Math.sin(a)*s);}ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;
    ctx.strokeStyle=c;ctx.lineWidth=1;ctx.globalAlpha=0.25;for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2-Math.PI/6;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*s,Math.sin(a)*s);ctx.stroke();}ctx.globalAlpha=1;
    ctx.fillStyle='#ff0000';ctx.shadowBlur=14;ctx.shadowColor='#ff0000';ctx.globalAlpha=eyePulse;
    ctx.fillRect(-s*.55,-s*.32,s*.45,s*.22);ctx.fillRect(s*.1,-s*.32,s*.45,s*.22);ctx.beginPath();ctx.arc(0,s*.18,s*.14,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.shadowBlur=0;
    ctx.fillStyle=c;ctx.globalAlpha=0.55*eyePulse;ctx.shadowBlur=20;ctx.shadowColor=c;ctx.beginPath();ctx.arc(0,0,s*.3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.shadowBlur=0;
    ctx.restore();
    const bx=canvas.width/2-(boss.mega?430:200),by=70,bw=boss.mega?860:400,bh=boss.mega?26:22,c2=['','#ff2200','#ff8800','#ffee00'][phase];
    ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(bx-2,by-2,bw+4,bh+4);ctx.fillStyle='#300';ctx.fillRect(bx,by,bw,bh);
    ctx.shadowBlur=12;ctx.shadowColor=c2;ctx.fillStyle=c2;ctx.fillRect(bx,by,bw*(boss.hp/boss.maxHp),bh);ctx.shadowBlur=0;
    ctx.strokeStyle=c2;ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);
    ctx.textAlign='center';ctx.font='bold 13px "Courier New"';ctx.fillStyle='#fff';
    ctx.fillText(`${boss.mega?'⚠ MEGA-BOSS':'OMEGA-BOSS'}  HP: ${boss.hp}/${boss.maxHp}  [FÁZE ${phase}]`,canvas.width/2,by+15);
}
function drawPowerups(){
    for(const p of powerups){
        const col=UPGRADES[p.type].color,fade=Math.min(1,p.life/60),pulse=0.6+0.4*Math.sin(frameCount*.1),isS=p.type==='storm';
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.spin);ctx.globalAlpha=fade;
        ctx.shadowBlur=isS?28:18;ctx.shadowColor=col;ctx.strokeStyle=col;ctx.lineWidth=isS?3:2;
        ctx.beginPath();ctx.arc(0,0,isS?22:18,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle=col;ctx.globalAlpha=fade*.18*pulse;ctx.beginPath();ctx.arc(0,0,isS?22:18,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=fade;const ds=isS?13:10;
        if(p.type==='heal'){
            // Cross / plus shape
            const arm=12,thick=5;
            ctx.fillStyle=col;
            ctx.fillRect(-thick/2,-arm,thick,arm*2);
            ctx.fillRect(-arm,-thick/2,arm*2,thick);
        } else {
            ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,-ds);ctx.lineTo(ds,0);ctx.lineTo(0,ds);ctx.lineTo(-ds,0);ctx.closePath();ctx.fill();
            ctx.fillStyle='#000';ctx.font=`bold ${isS?12:10}px "Courier New"`;ctx.textAlign='center';
            ctx.fillText({rapid:'R',power:'P',triple:'T',big:'B',storm:'⚡'}[p.type],0,isS?5:4);
        }
        ctx.shadowBlur=0;ctx.restore();
        ctx.save();ctx.globalAlpha=fade*.9;ctx.fillStyle=col;ctx.font=`bold ${isS?10:9}px "Courier New"`;ctx.textAlign='center';
        ctx.fillText(UPGRADES[p.type].label,p.x,p.y+(isS?36:30));
        if(isS){ctx.fillStyle='#888888';ctx.font='9px "Courier New"';ctx.fillText('mini-game required',p.x,p.y+47);}
        ctx.restore();
    }
}

// ─── Update ───────────────────────────────────────────────────────────────────
function update(){
    const pr=22;
    if(gravityMode){
        // ── Platformer movement ──────────────────────────────────────────────
        let mx=0;
        if(keys['a']||keys['A']||keys['ArrowLeft'])mx=-1;
        if(keys['d']||keys['D']||keys['ArrowRight'])mx=1;
        if(isMobile&&leftStick.active){const _l=Math.sqrt(leftStick.dx**2+leftStick.dy**2);if(_l>10)mx=leftStick.dx/leftStick.R;}
        {const _lvWp=communityLevel?(communityLevel.mapCols||GCOLS)*CELL:canvas.width;
        player.x=Math.max(pr,Math.min(_lvWp-pr,player.x+mx*player.speed));}
        // Jump
        if((keys['w']||keys['W']||keys['ArrowUp']||keys[' '])&&playerOnGround){
            playerVy=-13; playerOnGround=false;
        }
        // Gravity
        playerVy=Math.min(playerVy+0.55,16);
        player.y+=playerVy;
        playerOnGround=false;
        // Floor
        if(player.y+pr>=canvas.height){ player.y=canvas.height-pr; playerVy=0; playerOnGround=true; }
        // Ceiling
        if(player.y-pr<=0){ player.y=pr; if(playerVy<0)playerVy=0; }
        // Obstacle collision — platform-aware (skip spikes: they kill, don't block)
        for(const ob of obstacles){
            if(ob.type==='spike') continue;
            if(player.x+pr>ob.x&&player.x-pr<ob.x+ob.w&&player.y+pr>ob.y&&player.y-pr<ob.y+ob.h){
                const overL=player.x+pr-ob.x, overR=ob.x+ob.w-(player.x-pr);
                const overT=player.y+pr-ob.y, overB=ob.y+ob.h-(player.y-pr);
                const minX=Math.min(overL,overR), minY=Math.min(overT,overB);
                if(minX<minY){ player.x+=(overL<overR?-overL:overR); }
                else if(overT<overB){ player.y=ob.y-pr; if(playerVy>0){playerVy=0;playerOnGround=true;} }
                else { player.y=ob.y+ob.h+pr; if(playerVy<0)playerVy=0; }
            }
        }
        // Spike collision (instant death)
        if(!cheatGodmode&&player.invincible<=0){
            for(const ob of obstacles){
                if(ob.type==='spike'&&player.x+16>ob.x&&player.x-16<ob.x+ob.w&&player.y+16>ob.y&&player.y-16<ob.y+ob.h){
                    explode(player.x,player.y,'#ff2200');
                    floatingTexts.push({x:player.x,y:player.y-50,text:'SPIKE!',color:'#ff2200',size:22,life:60,maxLife:60});
                    state='gameover'; return;
                }
            }
        }
        if(isMobile&&rightStick.active){ keys['mouse']=true; }
        player.angle=Math.atan2(mouse.y-player.y,(mouse.x+cameraX)-player.x);
        if(player.invincible>0)player.invincible--;
        if(shootCooldown>0)shootCooldown--;
        if(keys['mouse'])shoot(); // Space = jump in gravity mode, not shoot
    } else {
        // ── Top-down movement (normal) ───────────────────────────────────────
        let mx=0,my=0;
        if(keys['w']||keys['ArrowUp'])my-=1;if(keys['s']||keys['ArrowDown'])my+=1;
        if(keys['a']||keys['ArrowLeft'])mx-=1;if(keys['d']||keys['ArrowRight'])mx+=1;
        if(isMobile&&leftStick.active){
            const _l=Math.sqrt(leftStick.dx**2+leftStick.dy**2);
            if(_l>10){mx=leftStick.dx/leftStick.R;my=leftStick.dy/leftStick.R;}
        } else if(mx&&my){mx*=0.707;my*=0.707;}
        {const _lvWp=communityLevel?(communityLevel.mapCols||GCOLS)*CELL:canvas.width;
        player.x=Math.max(22,Math.min(_lvWp-22,player.x+mx*player.speed));}
        player.y=Math.max(22,Math.min(canvas.height-22,player.y+my*player.speed));
        // Obstacle collision (push player out, skip spikes)
        for(const ob of obstacles){
            if(ob.type==='spike') continue;
            if(player.x+pr>ob.x&&player.x-pr<ob.x+ob.w&&player.y+pr>ob.y&&player.y-pr<ob.y+ob.h){
                const overL=player.x+pr-ob.x, overR=ob.x+ob.w-(player.x-pr);
                const overT=player.y+pr-ob.y, overB=ob.y+ob.h-(player.y-pr);
                const minX=Math.min(overL,overR), minY=Math.min(overT,overB);
                if(minX<minY){ player.x+=(overL<overR?-overL:overR); }
                else { player.y+=(overT<overB?-overT:overB); }
            }
        }
        // Spike collision (instant death) in top-down
        if(!cheatGodmode&&player.invincible<=0){
            for(const ob of obstacles){
                if(ob.type==='spike'&&player.x+16>ob.x&&player.x-16<ob.x+ob.w&&player.y+16>ob.y&&player.y-16<ob.y+ob.h){
                    explode(player.x,player.y,'#ff2200');
                    floatingTexts.push({x:player.x,y:player.y-50,text:'SPIKE!',color:'#ff2200',size:22,life:60,maxLife:60});
                    state='gameover'; return;
                }
            }
        }
        if(isMobile&&rightStick.active){ keys['mouse']=true; }
        player.angle=Math.atan2(mouse.y-player.y,(mouse.x+cameraX)-player.x);
        if(player.invincible>0)player.invincible--;
        if(shootCooldown>0)shootCooldown--;
        if(keys['mouse']||keys[' '])shoot();
    }
    // ── Camera + level bounds ────────────────────────────────────────────────
    const levelWidth=(communityLevel?(communityLevel.mapCols||GCOLS):GCOLS)*CELL;
    prevPlayerX=player.x;
    if(communityLevel&&levelWidth>canvas.width){
        const playerVxCam=player.x-prevPlayerX; // velocity for look-ahead
        const lookAhead=playerVxCam*10; // project 10 frames ahead
        const anchor=gravityMode?canvas.width*0.28:canvas.width/3;
        const targetX=player.x-anchor+lookAhead;
        const lerp=gravityMode?0.09:0.11;
        cameraX+=(targetX-cameraX)*lerp;
        cameraX=Math.max(0,Math.min(levelWidth-canvas.width,cameraX));
        // Clamp player inside level
        player.x=Math.max(22,Math.min(levelWidth-22,player.x));
        // Cull enemies too far off-camera
        enemies=enemies.filter(e=>e.x>cameraX-200&&e.x<cameraX+canvas.width+200);
    } else { cameraX=0; }
    if(player.upgradeTimer>0){player.upgradeTimer--;if(player.upgradeTimer===0){
        if(player.activeUpgrade==='storm'&&player.preStormMaxHp){
            player.maxHp=player.preStormMaxHp;
            player.hp=Math.min(player.hp,player.preStormMaxHp);
            floatingTexts.push({x:player.x,y:player.y-60,text:'STORM ENDED',color:'#ffff44',size:16,life:75,maxLife:75});
        }
        player.activeUpgrade=null;
    }}
    if(player.transformed){player.transformTimer--;if(player.transformTimer<=0)revertTransform();}
    if(player.activeUpgrade==='storm'&&frameCount%3===0){const a2=Math.random()*Math.PI*2,r=30+Math.random()*14;addParticle(player.x+Math.cos(a2)*r,player.y+Math.sin(a2)*r,Math.cos(a2)*-1,Math.sin(a2)*-1,'#ffff88',2+Math.random()*3,12);}

    // Powerup pickup
    for(let pi=powerups.length-1;pi>=0;pi--){
        const p=powerups[pi];p.spin+=0.04;p.life--;
        if(p.life<=0){powerups.splice(pi,1);continue;}
        const ddx=p.x-player.x,ddy=p.y-player.y;
        if(Math.sqrt(ddx*ddx+ddy*ddy)<28){
            // Storm is active — block non-heal pickups so storm isn't overwritten
            if(player.activeUpgrade==='storm' && p.type!=='heal') continue;
            if(p.type==='storm'){
                powerups.splice(pi,1);
                startMiniGame();
                return;
            }
            if(p.type==='shield'){
                if(player.shieldHits>0){powerups.splice(pi,1);continue;}  // already have shield, ignore
                player.shieldHits=2;
                explode(p.x,p.y,'#ffd700');
                for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2;addParticle(p.x,p.y,Math.cos(a)*5,Math.sin(a)*5,'#ffd700',3,30);}
                floatingTexts.push({x:player.x,y:player.y-42,text:'ŠTÍT ×4',color:'#ffd700',size:18,life:55,maxLife:55});
                powerups.splice(pi,1);continue;
            }
            if(p.type==='heal'){
                if(player.hp<player.maxHp){ player.hp++; }
                explode(p.x,p.y,'#00ff44');
                for(let i=0;i<10;i++){const a2=Math.random()*Math.PI*2;addParticle(p.x,p.y,Math.cos(a2)*4,Math.sin(a2)*4,'#00ff44',3+Math.random()*3,35);}
                floatingTexts.push({x:player.x,y:player.y-40,text:'+1 HP',color:'#00ff44',size:20,life:55,maxLife:55});
                powerups.splice(pi,1);
                continue;
            }
            player.activeUpgrade=p.type;player.upgradeTimer=UPGRADE_DURATION;
            explode(p.x,p.y,UPGRADES[p.type].color);
            for(let i=0;i<14;i++){const a2=Math.random()*Math.PI*2;addParticle(p.x,p.y,Math.cos(a2)*5,Math.sin(a2)*5,UPGRADES[p.type].color,3,28);}
            powerups.splice(pi,1);
        }
    }

    // Community level wave spawning (replaces normal spawn)
    if(communityLevel&&!boss){
        if(communityWavePause>0){
            communityWavePause--;
            if(communityWavePause===0)startCommunityWave(communityWave+1);
        } else if(communitySpawnQueue.length>0){
            communitySpawnTimer++;
            if(communitySpawnTimer>=45&&enemies.length<MAX_ENEMIES){
                spawnEnemy(communitySpawnQueue.shift());
                communitySpawnTimer=0;
            }
        } else if(!communityWaveClear&&enemies.length===0){
            communityWaveClear=true;
            communityWavePause=150;
            const heal=Math.min(2,player.maxHp-player.hp);
            if(heal>0){player.hp+=heal;floatingTexts.push({x:player.x,y:player.y-45,text:'+'+heal+' HP',color:'#00ff44',size:16,life:55,maxLife:55});}
            floatingTexts.push({x:canvas.width/2,y:canvas.height/2-30,text:`✓ VLNA ${communityWave+1} HOTOVO`,color:'#00ffaa',size:20,life:90,maxLife:90});
        }
    }
    // ── Tutorial step logic ────────────────────────────────────────────────────
    if(tutorialStep>=0){
        tutorialStepTimer++;
        if(tutorialStep===0){
            // Wait for movement
            if(Math.abs(player.x-tutorialStartX)>28||Math.abs(player.y-tutorialStartY)>28){
                tutorialStep=1; tutorialStepTimer=0;
                // Spawn one slow, 1-HP basic enemy
                spawnEnemy('basic');
                const te=enemies[enemies.length-1];
                if(te){te.speed=0.7;te.hp=1;te.maxHp=1;}
            }
        } else if(tutorialStep===1){
            // Wait for a player bullet to exist
            if(bullets.some(b=>b.fromPlayer)){tutorialStep=2; tutorialStepTimer=0;}
        } else if(tutorialStep===2){
            // Wait for first kill
            if(killCount>=1){
                tutorialStep=3; tutorialStepTimer=0;
                enemies=[];  // clear any remaining tutorial enemies
                // Spawn a bright heal powerup near player
                const pAngle=Math.random()*Math.PI*2;
                const pdist=110;
                powerups.push({x:player.x+Math.cos(pAngle)*pdist,y:player.y+Math.sin(pAngle)*pdist,type:'heal',life:900,maxLife:900,spin:0,_tutorial:true});
            }
        } else if(tutorialStep===3){
            // Wait for the tutorial heal powerup to be picked up (step timer > 10 to skip spawn-frame)
            if(tutorialStepTimer>10&&!powerups.some(p=>p._tutorial)){
                tutorialStep=4; tutorialStepTimer=0;
                // Spawn a few normal enemies so game feels alive
                for(let i=0;i<3;i++) spawnEnemy('basic');
            }
        } else if(tutorialStep===4){
            if(tutorialStepTimer>220){ tutorialStep=-1; } // tutorial done, normal game resumes
        }
    }
    if(!communityLevel&&!boss&&tutorialStep<0){const _b=Math.max(18,62-wave*5);const rate=difficulty==='easy'?Math.round(_b*1.5):difficulty==='hard'?Math.round(_b*0.55):_b;if(frameCount%rate===0&&enemies.length<MAX_ENEMIES)spawnEnemy();
        // Extra spawn timer for basic+tank only (half the normal interval)
        const _bt=Math.max(22,75-wave*5);const ratebt=difficulty==='easy'?Math.round(_bt*1.5):difficulty==='hard'?Math.round(_bt*0.55):_bt;
        if(frameCount%ratebt===0&&enemies.length<MAX_ENEMIES){const t2=Math.random()<0.6?'basic':'tank';const side2=Math.floor(Math.random()*4);let x2,y2;if(side2===0){x2=Math.random()*canvas.width;y2=-35;}else if(side2===1){x2=canvas.width+35;y2=Math.random()*canvas.height;}else if(side2===2){x2=Math.random()*canvas.width;y2=canvas.height+35;}else{x2=-35;y2=Math.random()*canvas.height;}const stats2={basic:{hp:2,speed:2,size:30},tank:{hp:5,speed:1.2,size:42}};const s2=stats2[t2];enemies.push({x:x2,y:y2,size:s2.size,hp:s2.hp,maxHp:s2.hp,speed:s2.speed,type:t2,angle:0,flash:0,shootTimer:0});}
        if(frameCount%600===0)wave++;} // end !communityLevel&&!boss
    if(mapTransition>0)mapTransition--;

    // Bullets
    bullets=bullets.filter(b=>{
        b.x+=b.vx;b.y+=b.vy;b.life--;
        if(b.life<=0||b.x<cameraX-60||b.x>cameraX+canvas.width+60||b.y<-30||b.y>canvas.height+30)return false;
        for(const ob of obstacles){if(b.x>ob.x&&b.x<ob.x+ob.w&&b.y>ob.y&&b.y<ob.y+ob.h){
            if(!b.pierce){addParticle(b.x,b.y,0,0,b.color||'#fff',3,12);return false;}
        }}
        return true;
    });

    // Enemies
    const eC={basic:'#ff0088',fast:'#ffee00',tank:'#ff4400',shooter:'#00ddff'};
    // Blade melee area damage
    if(player.activeUpgrade==='blade'&&frameCount%18===0){
        for(const e of enemies){const ddx=e.x-player.x,ddy=e.y-player.y;if(Math.sqrt(ddx*ddx+ddy*ddy)<88){e.hp--;e.flash=8;const a=Math.atan2(ddy,ddx);addParticle(player.x+Math.cos(a)*55,player.y+Math.sin(a)*55,(Math.random()-.5)*4+Math.cos(a)*2,(Math.random()-.5)*4+Math.sin(a)*2,'#ff44ff',3+Math.random()*2,20);if(e.hp<=0){explode(e.x,e.y,eC[e.type]);onEnemyKilled(e.x,e.y,e.type);score+=e.type==='tank'?30:e.type==='shooter'?25:e.type==='fast'?15:10;}}}
    }
    for(const e of enemies){
        if(e.latched){
            // Fast enemy latched: drain HP, stay on player, flee after 5s
            e.latchTimer--;
            e.latchDrainTimer--;
            // Stay attached at fixed angle offset from player
            const off=e.size*.7+20;
            e.x=player.x+Math.cos(e.latchAngle)*off;
            e.y=player.y+Math.sin(e.latchAngle)*off;
            e.angle=Math.atan2(player.y-e.y,player.x-e.x);
            if(e.flash>0)e.flash--;
            // Drain 1 HP every 150 frames — bypasses invincibility so other enemies can still hit
            if(e.latchDrainTimer<=0&&e.drainCount<2){
                e.drainCount++;e.latchDrainTimer=150;e.flash=12;
                if(player.shieldHits>0){
                    player.shieldHits--;
                    const sm=player.shieldHits===0?'ŠTÍT ZNIČEN!':`ŠTÍT: ${player.shieldHits}`;
                    floatingTexts.push({x:player.x,y:player.y-55,text:sm,color:'#ffd700',size:16,life:55,maxLife:55});
                    for(let i=0;i<10;i++){const a=Math.random()*Math.PI*2;addParticle(player.x,player.y,Math.cos(a)*5,Math.sin(a)*5,'#ffd700',3,28);}
                } else {
                    player.hp--;
                    floatingTexts.push({x:player.x,y:player.y-48,text:'-1 HP',color:'#ffee00',size:16,life:50,maxLife:50});
                    if(player.hp<=0){if(player.transformed){revertTransform();}else{state='gameover';return;}}
                }
            }
            // After 5 seconds → flee
            if(e.latchTimer<=0){
                e.latched=false;e.fleeing=true;
                const fdx=e.x-player.x,fdy=e.y-player.y,fd=Math.sqrt(fdx*fdx+fdy*fdy)||1;
                e.fleeVx=(fdx/fd)*5.5;e.fleeVy=(fdy/fd)*5.5;
                floatingTexts.push({x:e.x,y:e.y-30,text:'RAN AWAY!',color:'#ffee00',size:15,life:55,maxLife:55});
            }
        } else if(e.fleeing){
            // Fast enemy fleeing: zoom away, removed when off-screen
            e.x+=e.fleeVx;e.y+=e.fleeVy;
            if(e.flash>0)e.flash--;
            e.angle=Math.atan2(e.fleeVy,e.fleeVx);
        } else if(e.stuck){
            // Stuck enemy: count down, then deal damage and release
            e.stuckTimer--;
            e.angle=Math.atan2(player.y-e.y,player.x-e.x);
            if(e.flash>0)e.flash--;
            if(e.stuckTimer<=0){
                e.stuck=false;
                if(shieldOrDamage('#ff4400')){state='gameover';return;}
            }
        } else {
            const dx=player.x-e.x,dy=player.y-e.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
            // ── Wall avoidance pathfinding ───────────────────────────────────
            let mx=dx/dist,my=dy/dist; // desired direction unit vector
            const er=e.size*0.48;      // enemy collision radius
            const wallObs=obstacles.filter(o=>o.type!=='spike'); // only solid walls block enemies
            if(wallObs.length>0){
                // Look-ahead: check if desired move would enter a wall
                const lookD=e.speed+er+2;
                const nx0=e.x+mx*lookD,ny0=e.y+my*lookD;
                const directBlocked=wallObs.some(o=>nx0+er>o.x&&nx0-er<o.x+o.w&&ny0+er>o.y&&ny0-er<o.y+o.h);
                if(directBlocked){
                    // Try rotating direction in 20° steps to find a clear path
                    let found=false;
                    const baseAngle=Math.atan2(my,mx);
                    for(let step=20;step<=180;step+=20){
                        for(const sign of[1,-1]){
                            const a2=baseAngle+sign*step*Math.PI/180;
                            const tmx=Math.cos(a2),tmy=Math.sin(a2);
                            const tnx=e.x+tmx*lookD,tny=e.y+tmy*lookD;
                            if(!wallObs.some(o=>tnx+er>o.x&&tnx-er<o.x+o.w&&tny+er>o.y&&tny-er<o.y+o.h)){
                                mx=tmx;my=tmy;found=true;break;
                            }
                        }
                        if(found)break;
                    }
                }
                // Push out of any wall overlap
                e.x+=mx*e.speed;e.y+=my*e.speed;
                for(const o of wallObs){
                    if(e.x+er>o.x&&e.x-er<o.x+o.w&&e.y+er>o.y&&e.y-er<o.y+o.h){
                        const oL=e.x+er-o.x,oR=o.x+o.w-(e.x-er),oT=e.y+er-o.y,oB=o.y+o.h-(e.y-er);
                        const mX=Math.min(oL,oR),mY=Math.min(oT,oB);
                        if(mX<mY){e.x+=(oL<oR?-oL:oR);}else{e.y+=(oT<oB?-oT:oB);}
                    }
                }
            } else {
                e.x+=mx*e.speed;e.y+=my*e.speed;
            }
            e.angle=Math.atan2(my,mx);if(e.flash>0)e.flash--;
            if(e.type==='shooter'){e.shootTimer++;if(e.shootTimer>=60){e.shootTimer=0;const a=Math.atan2(player.y-e.y,player.x-e.x);const s2=e.size/2;for(const off of[-0.08,0.08]){bullets.push({x:e.x+Math.cos(a)*s2*1.4,y:e.y+Math.sin(a)*s2*1.4,vx:Math.cos(a+off)*4.5,vy:Math.sin(a+off)*4.5,life:140,fromPlayer:false,size:6,dmg:1,pierce:false,color:'#00ddff'});}}}
            for(let bi=bullets.length-1;bi>=0;bi--){const b=bullets[bi];if(!b.fromPlayer)continue;const ddx=b.x-e.x,ddy=b.y-e.y;if(Math.sqrt(ddx*ddx+ddy*ddy)<e.size*.55+(b.size||4)-4){e.hp-=(b.dmg||1);e.flash=10;if(!b.pierce)bullets.splice(bi,1);if(e.hp<=0){explode(e.x,e.y,eC[e.type]);onEnemyKilled(e.x,e.y,e.type);score+=e.type==='tank'?30:e.type==='shooter'?25:e.type==='fast'?15:10;}break;}}
            // Enemy touches player
            {const pdx=e.x-player.x,pdy=e.y-player.y;const pr=player.activeUpgrade==='storm'?26:18;if(Math.sqrt(pdx*pdx+pdy*pdy)<e.size*.5+pr){
                if(e.type==='fast'){
                    // Fast enemy latches onto player
                    e.latched=true;e.latchTimer=300;e.latchDrainTimer=150;e.drainCount=0;
                    e.latchAngle=Math.atan2(pdy,pdx);
                    floatingTexts.push({x:player.x,y:player.y-55,text:'CLICK TO REMOVE!',color:'#ffee00',size:14,life:80,maxLife:80});
                } else {
                    e.stuck=true;e.stuckHits=0;e.stuckTimer=150;
                }
            }}
        }
    }
    enemies=enemies.filter(e=>e.hp>0&&!(e.fleeing&&(e.x<-80||e.x>canvas.width+80||e.y<-80||e.y>canvas.height+80)));

    // Boss
    if(boss){
        const dx=player.x-boss.x,dy=player.y-boss.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
        const phase=boss.hp>boss.maxHp*2/3?1:boss.hp>boss.maxHp/3?2:3;
        const bSpd=boss.mega?[0,1.5,2.3,3.3][phase]:[0,1.1,1.8,2.7][phase];
        const bShootRate=boss.mega?[0,52,36,22][phase]:[0,75,55,36][phase];
        const bBulletCnt=boss.mega?[0,6,10,14][phase]:[0,4,6,9][phase];
        const bSpawnRate=boss.mega?[0,80,55,34][phase]:[0,130,90,60][phase];
        boss.x+=(dx/dist)*bSpd;boss.y+=(dy/dist)*bSpd;
        boss.angle=Math.atan2(dy,dx);if(boss.flash>0)boss.flash--;
        boss.shootTimer++;if(boss.shootTimer>=bShootRate){boss.shootTimer=0;const cnt=bBulletCnt;const bspd=boss.mega?6.5:5.5;for(let i=0;i<cnt;i++){const a=boss.angle+(i-(cnt-1)/2)*.22;bullets.push({x:boss.x,y:boss.y,vx:Math.cos(a)*bspd,vy:Math.sin(a)*bspd,life:130,fromPlayer:false,size:boss.mega?8:6,dmg:1,pierce:false,color:boss.mega?'#ff4400':'#ff2200'});}}
        boss.spawnTimer++;if(boss.spawnTimer>=bSpawnRate){boss.spawnTimer=0;spawnEnemy();if(boss.mega&&phase===3)spawnEnemy();}
        for(let bi=bullets.length-1;bi>=0;bi--){const b=bullets[bi];if(!b.fromPlayer)continue;const ddx=b.x-boss.x,ddy=b.y-boss.y;if(Math.sqrt(ddx*ddx+ddy*ddy)<boss.size*.55+(b.size||4)-4){boss.hp-=(b.dmg||1);boss.flash=10;if(!b.pierce)bullets.splice(bi,1);if(boss.hp<=0){const xc=boss.mega?12:6;for(let i=0;i<xc;i++){const ox=(Math.random()-.5)*120,oy=(Math.random()-.5)*120;explode(boss.x+ox,boss.y+oy,i%2?'#ff4400':'#ffaa00');}score+=boss.mega?1500:500;boss=null;state='victory';return;}break;}}
        if(player.invincible===0){const pdx=boss.x-player.x,pdy=boss.y-player.y;if(Math.sqrt(pdx*pdx+pdy*pdy)<boss.size*.5+20){player.invincible=4;if(shieldOrDamage('#00ffff')){state='gameover';return;}}}
    }

    // Enemy bullets hit player
    for(let bi=bullets.length-1;bi>=0;bi--){const b=bullets[bi];if(b.fromPlayer)continue;const ddx=b.x-player.x,ddy=b.y-player.y;if(Math.sqrt(ddx*ddx+ddy*ddy)<(player.activeUpgrade==='storm'?26:18)){bullets.splice(bi,1);if(shieldOrDamage('#ff2200')){state='gameover';return;}break;}}

    particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.91;p.vy*=.91;p.life--;return p.life>0;});
    floatingTexts=floatingTexts.filter(t=>{t.y-=1.2;t.life--;return t.life>0;});
    if(transformTimer>0){transformTimer--;if(transformTimer===0)transformAvailable=false;}
}

// ─── Draw bullets ─────────────────────────────────────────────────────────────
function drawBullets(){
    for(const b of bullets){
        if(b.lightning&&b.zigzag){
            const a=Math.atan2(b.vy,b.vx),len=18;
            ctx.save();ctx.shadowBlur=18;ctx.shadowColor='#ffff00';ctx.strokeStyle='#ffffaa';ctx.lineWidth=2.5;ctx.beginPath();
            for(let i=0;i<=b.zigzag.length;i++){const t=i/b.zigzag.length,nx=b.x-Math.cos(a)*len*t,ny=b.y-Math.sin(a)*len*t,off=i<b.zigzag.length?b.zigzag[i]:0,px=nx-Math.sin(a)*off,py=ny+Math.cos(a)*off;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}
            ctx.stroke();ctx.fillStyle='#ffffff';ctx.shadowBlur=0;ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill();ctx.restore();continue;
        }
        const col=b.color||'#00ffff',sz=b.size||4;
        ctx.save();ctx.shadowBlur=12+sz;ctx.shadowColor=col;ctx.fillStyle=col;ctx.beginPath();ctx.arc(b.x,b.y,sz,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=0.3;ctx.shadowBlur=0;ctx.beginPath();ctx.arc(b.x-b.vx*.5,b.y-b.vy*.5,sz*.6,0,Math.PI*2);ctx.fill();ctx.restore();
    }
}
function drawFloatingTexts(){
    for(const t of floatingTexts){
        const a=t.life/t.maxLife;
        ctx.save();ctx.globalAlpha=a;ctx.textAlign='center';
        ctx.font=`bold ${t.size}px "Courier New"`;
        ctx.shadowBlur=12;ctx.shadowColor=t.color;ctx.fillStyle=t.color;
        ctx.fillText(t.text,t.x,t.y);
        ctx.restore();
    }
}
function drawParticles(){for(const p of particles){const a=p.life/p.maxLife;ctx.save();ctx.globalAlpha=a*.9;ctx.shadowBlur=7;ctx.shadowColor=p.color;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*a,0,Math.PI*2);ctx.fill();ctx.restore();}}

// ─── Mobile controls overlay ─────────────────────────────────────────────────
function drawMobileControls(){
    if(!isMobile)return;
    ctx.save();
    // Pause button strip (top-center)
    if(state==='playing'||state==='paused'){
        ctx.globalAlpha=0.45;ctx.fillStyle='#001a22';
        roundRect(canvas.width/2-95,4,190,44,10);ctx.fill();
        ctx.globalAlpha=0.8;ctx.strokeStyle='#00ffff';ctx.lineWidth=1.5;
        roundRect(canvas.width/2-95,4,190,44,10);ctx.stroke();
        ctx.globalAlpha=1;ctx.fillStyle='#00ffff';ctx.font='bold 15px "Courier New"';ctx.textAlign='center';ctx.shadowBlur=0;
        ctx.fillText(state==='paused'?'▶ POKRAČOVAT':'❙❙ PAUZA',canvas.width/2,32);
    }
    if(state!=='playing'){ctx.restore();return;}
    // Helper: draw one joystick
    function drawStick(s,col,hint){
        if(s.active){
            // Outer ring base
            ctx.globalAlpha=0.15;ctx.fillStyle='#fff';
            ctx.beginPath();ctx.arc(s.bx,s.by,s.R,0,Math.PI*2);ctx.fill();
            ctx.globalAlpha=0.45;ctx.strokeStyle=col;ctx.lineWidth=2.5;
            ctx.beginPath();ctx.arc(s.bx,s.by,s.R,0,Math.PI*2);ctx.stroke();
            // Inner guide ring
            ctx.globalAlpha=0.2;ctx.lineWidth=1;
            ctx.beginPath();ctx.arc(s.bx,s.by,s.R*.45,0,Math.PI*2);ctx.stroke();
            const firing=s===rightStick&&Math.sqrt(s.dx**2+s.dy**2)>25;
            // Direction line
            if(firing){
                ctx.globalAlpha=0.35;ctx.strokeStyle=col;ctx.lineWidth=2;
                ctx.beginPath();ctx.moveTo(s.bx,s.by);ctx.lineTo(s.bx+s.dx,s.by+s.dy);ctx.stroke();
            }
            // Thumb
            ctx.globalAlpha=firing?0.92:0.68;ctx.fillStyle=col;
            ctx.shadowBlur=firing?22:6;ctx.shadowColor=col;
            ctx.beginPath();ctx.arc(s.bx+s.dx,s.by+s.dy,32,0,Math.PI*2);ctx.fill();
            ctx.shadowBlur=0;
        } else {
            // Always-visible hint ring at default position
            ctx.globalAlpha=0.13;ctx.strokeStyle=col;ctx.lineWidth=2;
            ctx.beginPath();ctx.arc(hint.x,hint.y,s.R,0,Math.PI*2);ctx.stroke();
            ctx.globalAlpha=0.08;ctx.fillStyle=col;
            ctx.beginPath();ctx.arc(hint.x,hint.y,s.R,0,Math.PI*2);ctx.fill();
            // Center dot
            ctx.globalAlpha=0.25;ctx.fillStyle=col;
            ctx.beginPath();ctx.arc(hint.x,hint.y,8,0,Math.PI*2);ctx.fill();
            // Label
            ctx.globalAlpha=0.22;ctx.font='bold 12px "Courier New"';ctx.textAlign='center';ctx.fillStyle=col;
            ctx.fillText(s===leftStick?'POHYB':'STŘELBA',hint.x,hint.y+s.R+16);
        }
    }
    drawStick(leftStick,'#00ffff',LS_HINT);
    // Right side: tap-to-shoot crosshair
    if(rightStick.active){
        const cx=mouse.x,cy=mouse.y,cr=18;
        ctx.globalAlpha=0.85;ctx.strokeStyle='#ff6600';ctx.lineWidth=2;ctx.shadowBlur=10;ctx.shadowColor='#ff6600';
        ctx.beginPath();ctx.arc(cx,cy,cr,0,Math.PI*2);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx-cr-6,cy);ctx.lineTo(cx+cr+6,cy);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx,cy-cr-6);ctx.lineTo(cx,cy+cr+6);ctx.stroke();
        ctx.shadowBlur=0;
    } else {
        ctx.globalAlpha=0.15;ctx.fillStyle='#ff6600';ctx.font='bold 13px "Courier New"';ctx.textAlign='center';
        ctx.fillText('KLEPNI PRO STŘELBU',canvas.width*3/4,canvas.height-20);
    }
    ctx.restore();
}

}

// ─── Cheat codes ──────────────────────────────────────────────────────────────
const VALID_CODES = ['godmode','strong','ultra robot','infinite'];
function submitCode() {
    const c = codeInput.trim();
    if (!VALID_CODES.includes(c)) {
        // shake / flash: just show error for now via floating UI (handled in draw)
        codeInput = '!invalid';
        setTimeout(()=>{ if(codeInput==='!invalid') codeInput=''; },900);
        return;
    }
    pendingCode = c;
    pauseSubState = 'codeConfirm';
}
function activateCode(code) {
    startGame(); // resets all cheats first
    if (code === 'godmode')      { cheatGodmode = true; }
    else if (code === 'strong')  { cheatStrong = true; }
    else if (code === 'ultra robot') {
        cheatUltraRobot = true;
        player.shieldHits = 1000;
    }
    else if (code === 'infinite') { cheatInfinite = true; }
    pendingCode = null; codeInput = '';
}
function ultraRobotXBlast() {
    // Fire 36 huge bullets in all directions
    const cnt = 36;
    for (let i = 0; i < cnt; i++) {
        const ang = (i / cnt) * Math.PI * 2;
        bullets.push({x:player.x+Math.cos(ang)*32, y:player.y+Math.sin(ang)*32,
            vx:Math.cos(ang)*16, vy:Math.sin(ang)*16, life:80, fromPlayer:true,
            size:9, dmg:999, pierce:true, color:'#ff00ff'});
    }
    for (let i=0;i<30;i++){
        const a=Math.random()*Math.PI*2;
        addParticle(player.x,player.y,Math.cos(a)*8,Math.sin(a)*8,'#ff00ff',4+Math.random()*3,40);
    }
    floatingTexts.push({x:player.x,y:player.y-65,text:'⚡ X-BLAST ⚡',color:'#ff00ff',size:22,life:70,maxLife:70});
}
