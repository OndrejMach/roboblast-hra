// ─── Draw obstacles ──────────────────────────────────────────────────────────
function drawObstacles(){
    // Draw player spawn marker (faint star, only at start)
    if(communityLevel&&communityLevel.playerSpawn&&frameCount<300){
        const ps=communityLevel.playerSpawn;
        const wx=ps.col*CELL+CELL/2,wy=ps.row*CELL+CELL/2;
        const fade=Math.max(0,1-frameCount/300);
        ctx.strokeStyle=`rgba(0,255,255,${fade*0.6})`;ctx.lineWidth=2;
        ctx.beginPath();
        for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,r=i%2===0?18:9;i===0?ctx.moveTo(wx+Math.cos(a)*r,wy+Math.sin(a)*r):ctx.lineTo(wx+Math.cos(a)*r,wy+Math.sin(a)*r);}
        ctx.closePath();ctx.stroke();
    }
    // Draw spawn point markers (faint, in-game)
    if(communityLevel&&(communityLevel.spawnPoints||[]).length>0){
        for(const sp of communityLevel.spawnPoints){
            const wx=sp.col*CELL+CELL/2,wy=sp.row*CELL+CELL/2;
            const pulse=0.4+0.2*Math.sin(frameCount*0.07);
            ctx.strokeStyle=`rgba(255,180,0,${pulse})`;ctx.lineWidth=1.5;
            ctx.beginPath();ctx.moveTo(wx,wy-10);ctx.lineTo(wx+10,wy);ctx.lineTo(wx,wy+10);ctx.lineTo(wx-10,wy);ctx.closePath();ctx.stroke();
        }
    }
    if(!obstacles.length)return;
    const theme=MAP_THEMES[Math.min(mapLevel,MAP_THEMES.length-1)];
    const gc=theme.grid.replace('rgba(','').replace(')','').split(',');
    const wallCol=`rgba(${gc[0]},${gc[1]},${gc[2]},0.85)`;
    const borderCol=`rgba(${gc[0]},${gc[1]},${gc[2]},1)`;
    for(const ob of obstacles){
        if(ob.type==='spike'){
            // Draw spike tile — red triangular spikes
            ctx.fillStyle='rgba(20,0,0,0.8)'; ctx.fillRect(ob.x,ob.y,ob.w,ob.h);
            const sc=5; // number of spike tips per cell row
            const sw=ob.w/sc;
            ctx.fillStyle='#ff2200'; ctx.shadowBlur=8; ctx.shadowColor='#ff4400';
            ctx.beginPath();
            for(let i=0;i<sc;i++){
                const bx=ob.x+i*sw;
                ctx.moveTo(bx,ob.y+ob.h);
                ctx.lineTo(bx+sw/2,ob.y+4);
                ctx.lineTo(bx+sw,ob.y+ob.h);
            }
            // Bottom row (pointing down)
            for(let i=0;i<sc;i++){
                const bx=ob.x+i*sw;
                ctx.moveTo(bx,ob.y);
                ctx.lineTo(bx+sw/2,ob.y+ob.h-4);
                ctx.lineTo(bx+sw,ob.y);
            }
            ctx.fill();
            ctx.shadowBlur=0;
            ctx.strokeStyle='#ff4400'; ctx.lineWidth=1; ctx.strokeRect(ob.x,ob.y,ob.w,ob.h);
        } else {
            ctx.fillStyle=wallCol; ctx.fillRect(ob.x,ob.y,ob.w,ob.h);
            ctx.strokeStyle=borderCol; ctx.lineWidth=2; ctx.strokeRect(ob.x+1,ob.y+1,ob.w-2,ob.h-2);
            // Cross-hatch
            ctx.strokeStyle=`rgba(${gc[0]},${gc[1]},${gc[2]},0.3)`; ctx.lineWidth=1;
            ctx.beginPath(); ctx.moveTo(ob.x,ob.y); ctx.lineTo(ob.x+ob.w,ob.y+ob.h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(ob.x+ob.w,ob.y); ctx.lineTo(ob.x,ob.y+ob.h); ctx.stroke();
        }
    }
}

// ─── Level editor ────────────────────────────────────────────────────────────
const ECOLS={basic:'#ff0088',fast:'#ffee00',tank:'#ff4400',shooter:'#00ddff'};
const CELL=50, GCOLS=18, GROWS=12;

function editorObsToArray(){
    const walls=[...editorObsSet].map(k=>{const[c,r]=k.split(',').map(Number);return{col:c,row:r};});
    const spikes=[...editorSpikeSet].map(k=>{const[c,r]=k.split(',').map(Number);return{col:c,row:r,type:'spike'};});
    return [...walls,...spikes];
}
function editorEnsureWave(){
    if(!editorLevel.waves[editorSelWave]) editorLevel.waves[editorSelWave]={enemies:[{type:'basic',count:5}]};
}

function edBtn(label,x,y,w,h,col,hov){
    ctx.fillStyle=hov?`${col}22`:'rgba(0,0,0,0.55)';ctx.fillRect(x,y,w,h);
    ctx.strokeStyle=hov?col:`${col}66`;ctx.lineWidth=hov?2:1;ctx.strokeRect(x,y,w,h);
    if(hov){ctx.shadowBlur=10;ctx.shadowColor=col;}
    ctx.fillStyle=hov?col:`${col}cc`;ctx.font=`bold ${hov?13:12}px "Courier New"`;ctx.textAlign='center';
    ctx.fillText(label,x+w/2,y+h/2+5);ctx.shadowBlur=0;
}

function drawEditor(){
    // ── Shared constants ──────────────────────────────────────────────────────
    const BOT=canvas.height-48; // bottom bar y
    const TOP=50;               // content start y (below header)

    // ────────────────────────────── MAP TAB ──────────────────────────────────
    if(editorTab==='map'){
        drawBackground();
        // Draw placed obstacles
        const theme=MAP_THEMES[Math.min(editorLevel.mapTheme||0,MAP_THEMES.length-1)];
        const gc=theme.grid.replace('rgba(','').replace(')','').split(',');
        const wc=`rgba(${gc[0]},${gc[1]},${gc[2]}`;
        for(const k of editorObsSet){
            const[c,r]=k.split(',').map(Number);
            const sc=c-editorMapScrollCol;
            if(sc<-1||sc>GCOLS)continue;
            const sx=sc*CELL;
            ctx.fillStyle=wc+',0.8)';ctx.fillRect(sx,r*CELL,CELL,CELL);
            ctx.strokeStyle=wc+',1)';ctx.lineWidth=2;ctx.strokeRect(sx+1,r*CELL+1,CELL-2,CELL-2);
            ctx.strokeStyle=wc+',0.25)';ctx.lineWidth=1;
            ctx.beginPath();ctx.moveTo(sx,r*CELL);ctx.lineTo(sx+CELL,r*CELL+CELL);ctx.stroke();
            ctx.beginPath();ctx.moveTo(sx+CELL,r*CELL);ctx.lineTo(sx,r*CELL+CELL);ctx.stroke();
        }
        // Spike obstacles
        for(const k of editorSpikeSet){
            const[c,r]=k.split(',').map(Number);
            const sc=c-editorMapScrollCol;
            if(sc<-1||sc>GCOLS)continue;
            const sx=sc*CELL;
            ctx.fillStyle='rgba(20,0,0,0.75)';ctx.fillRect(sx,r*CELL,CELL,CELL);
            const spc=5,sw=CELL/spc;
            ctx.fillStyle='#ff2200';ctx.shadowBlur=6;ctx.shadowColor='#ff4400';
            ctx.beginPath();
            for(let i=0;i<spc;i++){const bx=sx+i*sw;ctx.moveTo(bx,r*CELL+CELL);ctx.lineTo(bx+sw/2,r*CELL+4);ctx.lineTo(bx+sw,r*CELL+CELL);}
            ctx.fill();ctx.shadowBlur=0;
            ctx.strokeStyle='#ff4400';ctx.lineWidth=1;ctx.strokeRect(sx,r*CELL,CELL,CELL);
        }
        // Grid
        ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;
        for(let c=0;c<=GCOLS;c++){ctx.beginPath();ctx.moveTo(c*CELL,0);ctx.lineTo(c*CELL,canvas.height);ctx.stroke();}
        for(let r=0;r<=GROWS;r++){ctx.beginPath();ctx.moveTo(0,r*CELL);ctx.lineTo(canvas.width,r*CELL);ctx.stroke();}
        // Column numbers at top of grid
        ctx.font='9px "Courier New"';ctx.fillStyle='rgba(255,255,255,0.12)';ctx.textAlign='center';
        for(let c=0;c<GCOLS&&(c+editorMapScrollCol)<(editorLevel.mapCols||36);c++){ctx.fillText(c+editorMapScrollCol+1,c*CELL+CELL/2,TOP+12);}
        // Draw spawn points
        for(const sp of (editorLevel.spawnPoints||[])){
            const sc=sp.col-editorMapScrollCol;
            if(sc<0||sc>=GCOLS)continue;
            const sx=sc*CELL+CELL/2,sy=sp.row*CELL+CELL/2,pulse=0.75+0.25*Math.sin(frameCount*0.08);
            ctx.shadowBlur=10*pulse;ctx.shadowColor='#ffcc00';
            ctx.fillStyle=`rgba(255,200,0,${0.85*pulse})`;
            ctx.beginPath();ctx.moveTo(sx,sy-14);ctx.lineTo(sx+14,sy);ctx.lineTo(sx,sy+14);ctx.lineTo(sx-14,sy);ctx.closePath();ctx.fill();
            ctx.strokeStyle='#fff8';ctx.lineWidth=1.5;ctx.stroke();
            ctx.shadowBlur=0;
            ctx.fillStyle='#000a';ctx.font='bold 9px "Courier New"';ctx.textAlign='center';ctx.fillText('S',sx,sy+3);
        }
        // Draw player spawn point
        if(editorLevel.playerSpawn){
            const ps=editorLevel.playerSpawn;
            const sc=ps.col-editorMapScrollCol;
            if(sc>=0&&sc<GCOLS){
                const sx=sc*CELL+CELL/2,sy=ps.row*CELL+CELL/2;
                const pulse=0.8+0.2*Math.sin(frameCount*0.1);
                ctx.shadowBlur=14*pulse;ctx.shadowColor='#00ffff';
                // Cyan star / person icon
                ctx.fillStyle=`rgba(0,255,255,${0.9*pulse})`;
                ctx.beginPath();
                for(let i=0;i<8;i++){
                    const a=i*Math.PI/4-Math.PI/2;
                    const r=i%2===0?16:8;
                    i===0?ctx.moveTo(sx+Math.cos(a)*r,sy+Math.sin(a)*r):ctx.lineTo(sx+Math.cos(a)*r,sy+Math.sin(a)*r);
                }
                ctx.closePath();ctx.fill();
                ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
                ctx.shadowBlur=0;
                ctx.fillStyle='#000c';ctx.font='bold 9px "Courier New"';ctx.textAlign='center';ctx.fillText('P',sx,sy+3);
            }
        }
        // Hover highlight
        const hcScreen=Math.floor(mouse.x/CELL),hr=Math.floor(mouse.y/CELL);
        const hc=hcScreen+editorMapScrollCol;
        if(hcScreen>=0&&hcScreen<GCOLS&&hr>=0&&hr<GROWS&&mouse.y<BOT&&mouse.y>TOP){
            if(editorMapTool==='spawn'){
                const alreadyHas=(editorLevel.spawnPoints||[]).some(sp=>sp.col===hc&&sp.row===hr);
                ctx.fillStyle=alreadyHas?'rgba(255,60,60,0.35)':'rgba(255,200,0,0.25)';
            } else if(editorMapTool==='player'){
                ctx.fillStyle='rgba(0,255,255,0.25)';
            } else if(editorMapTool==='spike'){
                ctx.fillStyle=editorSpikeSet.has(`${hc},${hr}`)?'rgba(255,60,60,0.3)':'rgba(255,50,0,0.25)';
            } else {
                ctx.fillStyle=editorObsSet.has(`${hc},${hr}`)? 'rgba(255,60,60,0.3)':'rgba(0,255,170,0.18)';
            }
            ctx.fillRect(hcScreen*CELL,hr*CELL,CELL,CELL);
        }
        // ── Top bar ──
        ctx.fillStyle='rgba(0,0,0,0.88)';ctx.fillRect(0,0,canvas.width,TOP);
        ctx.textAlign='left';ctx.font='bold 12px "Courier New"';ctx.fillStyle='#00ffaa';
        ctx.fillText('🗺  MAPA PŘEKÁŽEK',8,16);
        // Scroll arrows + col info
        const mapCols=editorLevel.mapCols||36;
        const maxScrollCol=Math.max(0,mapCols-GCOLS);
        const scBx=8,scBy=22,scBw=22,scBh=22;
        // ◀ button
        const scLH=mouse.x>=scBx&&mouse.x<=scBx+scBw&&mouse.y>=scBy&&mouse.y<=scBy+scBh;
        ctx.fillStyle=scLH?'rgba(0,255,170,0.2)':'rgba(0,0,0,0.4)';ctx.fillRect(scBx,scBy,scBw,scBh);
        ctx.strokeStyle=editorMapScrollCol>0?(scLH?'#00ffaa':'#00ffaa66'):'#223344';ctx.lineWidth=1;ctx.strokeRect(scBx,scBy,scBw,scBh);
        ctx.fillStyle=editorMapScrollCol>0?'#00ffaa':'#334455';ctx.font='bold 14px "Courier New"';ctx.textAlign='center';ctx.fillText('◀',scBx+scBw/2,scBy+scBh-5);
        // col display
        ctx.fillStyle='#445566';ctx.font='10px "Courier New"';ctx.textAlign='center';
        ctx.fillText(`${editorMapScrollCol+1}-${Math.min(editorMapScrollCol+GCOLS,mapCols)} / ${mapCols} sl.`,scBx+scBw+44,scBy+scBh-4);
        // ▶ button
        const scRBx=scBx+scBw+90,scRH=mouse.x>=scRBx&&mouse.x<=scRBx+scBw&&mouse.y>=scBy&&mouse.y<=scBy+scBh;
        ctx.fillStyle=scRH?'rgba(0,255,170,0.2)':'rgba(0,0,0,0.4)';ctx.fillRect(scRBx,scBy,scBw,scBh);
        ctx.strokeStyle=editorMapScrollCol<maxScrollCol?(scRH?'#00ffaa':'#00ffaa66'):'#223344';ctx.lineWidth=1;ctx.strokeRect(scRBx,scBy,scBw,scBh);
        ctx.fillStyle=editorMapScrollCol<maxScrollCol?'#00ffaa':'#334455';ctx.font='bold 14px "Courier New"';ctx.textAlign='center';ctx.fillText('▶',scRBx+scBw/2,scBy+scBh-5);
        // + Extend button
        const exBx=scRBx+scBw+8,exBw=120,exBH=mouse.x>=exBx&&mouse.x<=exBx+exBw&&mouse.y>=scBy&&mouse.y<=scBy+scBh;
        ctx.fillStyle=exBH?'rgba(255,200,0,0.15)':'rgba(0,0,0,0.4)';ctx.fillRect(exBx,scBy,exBw,scBh);
        ctx.strokeStyle=exBH?'#ffcc00':'#ffcc0055';ctx.lineWidth=1;ctx.strokeRect(exBx,scBy,exBw,scBh);
        ctx.fillStyle=exBH?'#ffcc00':'#ffcc0088';ctx.font='bold 11px "Courier New"';ctx.textAlign='center';ctx.fillText('+ PRODLOUŽIT',exBx+exBw/2,scBy+scBh-5);
        // Theme swatches
        const swW=28,swH=20,swY=14,swGap=3,swStartX=canvas.width-10*(swW+swGap)-60;
        // Scroll progress bar
        ctx.textAlign='left';
        const sbX=8,sbY=46,sbW=swStartX-16,sbH=3;
        ctx.fillStyle='#0a1a20';ctx.fillRect(sbX,sbY,sbW,sbH);
        if(maxScrollCol>0){const hW=Math.max(20,sbW*GCOLS/mapCols);const hX=sbX+(sbW-hW)*editorMapScrollCol/maxScrollCol;ctx.fillStyle='#00ffaa55';ctx.fillRect(hX,sbY,hW,sbH);}
        ctx.textAlign='left';
        ctx.font='10px "Courier New"';ctx.fillStyle='#445566';ctx.fillText('TÉMA:',swStartX-42,swY+14);
        for(let i=0;i<10;i++){
            const t=MAP_THEMES[i],sx=swStartX+i*(swW+swGap);
            const gr=ctx.createLinearGradient(sx,swY,sx,swY+swH);
            gr.addColorStop(0,t.sky[0]);gr.addColorStop(1,t.sky[2]||t.sky[1]);
            ctx.fillStyle=gr;ctx.fillRect(sx,swY,swW,swH);
            const isSel=i===editorLevel.mapTheme;
            ctx.strokeStyle=isSel?'#fff':'#334455';ctx.lineWidth=isSel?2.5:1;ctx.strokeRect(sx,swY,swW,swH);
            ctx.fillStyle='#fff';ctx.font='8px "Courier New"';ctx.textAlign='center';ctx.fillText(i+1,sx+swW/2,swY+swH-5);
        }
        // ── Bottom bar ──
        ctx.fillStyle='rgba(0,0,0,0.88)';ctx.fillRect(0,BOT,canvas.width,canvas.height-BOT);
        const bkBx=10,bkBw=120,bkBh=32,bkBy=BOT+8;
        edBtn('← ZPĚT',bkBx,bkBy,bkBw,bkBh,'#00ffaa',mouse.x>=bkBx&&mouse.x<=bkBx+bkBw&&mouse.y>=bkBy&&mouse.y<=bkBy+bkBh);
        // Tool selector: OBSTACLES | SPAWN NEPŘÁTEL | HRÁČ SPAWN
        const tBh=32,tBy=BOT+8;
        const tools=[
            {id:'obstacles',lbl:'🧱 ZDI',      col:'#00ffaa',x:140,w:80},
            {id:'spike',    lbl:'🔺 SPIKY',     col:'#ff3300',x:228,w:80},
            {id:'spawn',    lbl:'🔴 SPAWN',     col:'#ffcc00',x:316,w:90},
            {id:'player',   lbl:'🟢 HRÁČ',     col:'#00ffff',x:414,w:70},
        ];
        for(const t of tools){
            const hov=mouse.x>=t.x&&mouse.x<=t.x+t.w&&mouse.y>=tBy&&mouse.y<=tBy+tBh;
            const sel=editorMapTool===t.id;
            ctx.fillStyle=sel?`${t.col}22`:(hov?`${t.col}0d`:'rgba(0,0,0,0.45)');ctx.fillRect(t.x,tBy,t.w,tBh);
            ctx.strokeStyle=sel?t.col:(hov?`${t.col}66`:'#334455');ctx.lineWidth=sel?2:1;ctx.strokeRect(t.x,tBy,t.w,tBh);
            ctx.fillStyle=sel?t.col:(hov?`${t.col}cc`:'#556677');ctx.font=`bold 11px "Courier New"`;ctx.textAlign='center';ctx.fillText(t.lbl,t.x+t.w/2,tBy+tBh/2+4);
        }
        // Gravity toggle
        const grBx=492,grBw=118,grBh=32,grBy=BOT+8,grOn=!!(editorLevel.gravity);
        edBtn(grOn?'🌍 GRAV: ZAP':'⬆ GRAV: VYP',grBx,grBy,grBw,grBh,grOn?'#ffaa00':'#445566',mouse.x>=grBx&&mouse.x<=grBx+grBw&&mouse.y>=grBy&&mouse.y<=grBy+grBh);
        // Delete / clear button (context-sensitive)
        const clBx=618,clBw=110,clBh=32,clBy=BOT+8;
        const clLabel=editorMapTool==='spawn'?'🗑 SMAŽ SPAWN':editorMapTool==='player'?'🗑 SMAŽ HRÁČE':editorMapTool==='spike'?'🗑 SMAŽ SPIKY':'🗑 SMAŽ ZDI';
        edBtn(clLabel,clBx,clBy,clBw,clBh,'#ff4444',mouse.x>=clBx&&mouse.x<=clBx+clBw&&mouse.y>=clBy&&mouse.y<=clBy+clBh);
        ctx.textAlign='right';ctx.font='10px "Courier New"';ctx.fillStyle='#334455';
        const psInfo=editorLevel.playerSpawn?`Hráč: (${editorLevel.playerSpawn.col},${editorLevel.playerSpawn.row})`:'Hráč: default';
        ctx.fillText(`Zdi: ${editorObsSet.size}  ·  Spiky: ${editorSpikeSet.size}  ·  Spawn: ${(editorLevel.spawnPoints||[]).length}  ·  ${psInfo}`,canvas.width-10,BOT+28);
        ctx.shadowBlur=0;
        return;
    }

    // ─────────────────────────── WAVES / SETTINGS ────────────────────────────
    ctx.fillStyle='rgba(0,2,12,0.98)';ctx.fillRect(0,0,canvas.width,canvas.height);

    // ── Top header ──
    ctx.textAlign='center';ctx.font='bold 18px "Courier New"';ctx.shadowBlur=10;ctx.shadowColor='#00ffaa';ctx.fillStyle='#00ffaa';
    ctx.fillText('✏  EDITOR LEVELŮ',canvas.width/2,28);ctx.shadowBlur=0;
    // Level name preview
    ctx.font='11px "Courier New"';ctx.fillStyle='#334455';
    ctx.fillText(editorLevel.name?`"${editorLevel.name}"  ·  Autor: ${editorLevel.author||'?'}`:'← zadej název a autora v záložce NASTAVENÍ',canvas.width/2,44);

    // ── Tab bar ──
    const TABS=[{id:'waves',lbl:'📋 VLNY'},{id:'map',lbl:'🗺 MAPA'},{id:'settings',lbl:'⚙ NASTAVENÍ'}];
    const TW=180,TH=34,TY=TOP,TSX=canvas.width/2-TABS.length*TW/2;
    for(let i=0;i<TABS.length;i++){
        const tx=TSX+i*TW,cur=editorTab===TABS[i].id,hov=mouse.x>=tx&&mouse.x<=tx+TW&&mouse.y>=TY&&mouse.y<=TY+TH;
        ctx.fillStyle=cur?'rgba(0,255,170,0.14)':hov?'rgba(0,255,170,0.06)':'rgba(0,0,0,0.45)';ctx.fillRect(tx,TY,TW,TH);
        ctx.strokeStyle=cur?'#00ffaa':hov?'#00ffaa55':'#00ffaa18';ctx.lineWidth=cur?2:1;ctx.strokeRect(tx,TY,TW,TH);
        ctx.fillStyle=cur?'#00ffaa':hov?'#88ddcc':'#335544';ctx.font=`bold ${cur?13:12}px "Courier New"`;ctx.textAlign='center';
        ctx.fillText(TABS[i].lbl,tx+TW/2,TY+TH/2+5);
    }

    // ── Bottom action bar ──
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,BOT,canvas.width,canvas.height-BOT);
    // BACK
    edBtn('← ZPĚT',10,BOT+8,90,32,'#ff6600',mouse.x>=10&&mouse.x<=100&&mouse.y>=BOT+8&&mouse.y<=BOT+40);
    // Status message
    if(editorMsgTimer>0){
        editorMsgTimer--;
        const mc=editorMsg.startsWith('✓')?'#00ffaa':editorMsg.startsWith('✗')||editorMsg.startsWith('⚠')?'#ff4444':'#aaaaff';
        ctx.font='bold 12px "Courier New"';ctx.fillStyle=mc;ctx.textAlign='center';ctx.fillText(editorMsg,canvas.width/2,BOT+28);
    } else {
        ctx.font='11px "Courier New"';ctx.fillStyle='#223344';ctx.textAlign='center';
        ctx.fillText(`Vlny: ${editorLevel.waves.length}  ·  Zdi: ${editorObsSet.size}  ·  Spiky: ${editorSpikeSet.size}  ·  Mapa: ${MAP_THEMES[editorLevel.mapTheme||0].name}  ·  ${editorLevel.gravity?'🌍 Gravitace ZAP':'Gravitace VYP'}`,canvas.width/2,BOT+28);
    }
    // TEST button
    const TB={x:canvas.width-216,y:BOT+7,w:100,h:34};
    edBtn('▶ TESTOVAT',TB.x,TB.y,TB.w,TB.h,'#00ff44',mouse.x>=TB.x&&mouse.x<=TB.x+TB.w&&mouse.y>=TB.y&&mouse.y<=TB.y+TB.h);
    // UPLOAD button
    const UB={x:canvas.width-108,y:BOT+7,w:100,h:34};
    edBtn('☁ NAHRÁT',UB.x,UB.y,UB.w,UB.h,'#0088ff',mouse.x>=UB.x&&mouse.x<=UB.x+UB.w&&mouse.y>=UB.y&&mouse.y<=UB.y+UB.h);

    // ── Content ──
    const CY=TOP+TH+10; // content top

    if(editorTab==='waves'){
        // Left panel: wave list (x=10..270)
        const LX=10,LW=255,RH=50;
        ctx.textAlign='left';ctx.font='bold 11px "Courier New"';ctx.fillStyle='#334455';
        ctx.fillText('POŘADÍ VLN:',LX,CY+12);
        const maxWaves=Math.floor((BOT-CY-40)/RH);
        for(let wi=0;wi<Math.min(editorLevel.waves.length,maxWaves);wi++){
            const wy=CY+20+wi*RH;
            const sel=wi===editorSelWave;
            const hov=mouse.x>=LX&&mouse.x<=LX+LW&&mouse.y>=wy&&mouse.y<=wy+RH-4;
            ctx.fillStyle=sel?'rgba(0,255,170,0.13)':hov?'rgba(0,255,170,0.05)':'rgba(0,0,0,0.4)';ctx.fillRect(LX,wy,LW,RH-4);
            ctx.strokeStyle=sel?'#00ffaa':hov?'#00ffaa44':'#1a2a30';ctx.lineWidth=sel?2:1;ctx.strokeRect(LX,wy,LW,RH-4);
            const wv=editorLevel.waves[wi];
            const tot=(wv.enemies||[]).reduce((s,e)=>s+e.count,0);
            ctx.fillStyle=sel?'#00ffaa':'#99bbcc';ctx.font=`bold 13px "Courier New"`;ctx.fillText(`Vlna ${wi+1} — ${tot} nepřátel`,LX+8,wy+17);
            ctx.font='10px "Courier New"';ctx.fillStyle='#334455';
            const sp=(wv.enemies||[]).filter(e=>e.count>0).map(e=>`${e.count}×${e.type.slice(0,3)}`).join(' ');
            ctx.fillText(sp||'(prázdná)',LX+8,wy+33);
            // ×delete
            const DX=LX+LW-26,DY=wy+13;
            const dh=mouse.x>=DX&&mouse.x<=DX+18&&mouse.y>=DY&&mouse.y<=DY+18;
            ctx.fillStyle=dh?'rgba(255,60,60,0.3)':'rgba(255,60,60,0.1)';ctx.fillRect(DX,DY,18,18);
            ctx.fillStyle=dh?'#ff5555':'#773333';ctx.font='bold 14px "Courier New"';ctx.textAlign='center';ctx.fillText('×',DX+9,DY+14);ctx.textAlign='left';
        }
        // + Add wave
        const AWY=CY+20+Math.min(editorLevel.waves.length,maxWaves)*RH;
        const ah=mouse.x>=LX&&mouse.x<=LX+LW&&mouse.y>=AWY&&mouse.y<=AWY+34;
        ctx.fillStyle=ah?'rgba(0,255,170,0.1)':'rgba(0,0,0,0.3)';ctx.fillRect(LX,AWY,LW,34);
        ctx.strokeStyle=ah?'#00ffaa44':'#1a2a30';ctx.lineWidth=1;ctx.strokeRect(LX,AWY,LW,34);
        ctx.fillStyle=ah?'#00ffaa':'#335544';ctx.font='bold 12px "Courier New"';ctx.textAlign='center';ctx.fillText('＋ Přidat vlnu',LX+LW/2,AWY+22);ctx.textAlign='left';

        // Right panel: enemy editor (x=280..870)
        editorEnsureWave();
        const RX=280;
        ctx.fillStyle='#334455';ctx.font='bold 11px "Courier New"';
        ctx.fillText(`NEPŘÁTELÉ VE VLNĚ ${editorSelWave+1}:`,RX,CY+12);
        const TYPES=[{id:'basic',lbl:'🟣 Basic',desc:'2 HP · rychlý',c:'#ff0088'},
                     {id:'fast', lbl:'🟡 Fast', desc:'1 HP · latchuje',c:'#ffee00'},
                     {id:'tank', lbl:'🟠 Tank', desc:'5 HP · pomalý',c:'#ff4400'},
                     {id:'shooter',lbl:'🔵 Shooter',desc:'7 HP · střílí',c:'#00ddff'}];
        for(let ti=0;ti<TYPES.length;ti++){
            const tp=TYPES[ti];
            let eg=editorLevel.waves[editorSelWave].enemies.find(e=>e.type===tp.id);
            if(!eg){eg={type:tp.id,count:0};editorLevel.waves[editorSelWave].enemies.push(eg);}
            const EY=CY+22+ti*66;
            // Row bg
            ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(RX,EY-2,canvas.width-RX-20,58);
            ctx.strokeStyle='#1a2a30';ctx.lineWidth=1;ctx.strokeRect(RX,EY-2,canvas.width-RX-20,58);
            // Label
            ctx.fillStyle=tp.c;ctx.font='bold 14px "Courier New"';ctx.fillText(tp.lbl,RX+8,EY+18);
            ctx.fillStyle='#334455';ctx.font='10px "Courier New"';ctx.fillText(tp.desc,RX+8,EY+36);
            // − count + buttons (right side)
            const BX=canvas.width-180,BSZ=36,BY=EY+6;
            const mh=mouse.x>=BX&&mouse.x<=BX+BSZ&&mouse.y>=BY&&mouse.y<=BY+BSZ;
            const ph=mouse.x>=BX+BSZ+50&&mouse.x<=BX+BSZ+50+BSZ&&mouse.y>=BY&&mouse.y<=BY+BSZ;
            edBtn('−',BX,BY,BSZ,BSZ,'#ff6600',mh);
            ctx.fillStyle=eg.count>0?'#ffffff':'#334455';ctx.font=`bold ${eg.count>9?20:22}px "Courier New"`;ctx.textAlign='center';
            ctx.fillText(eg.count,BX+BSZ+25,BY+BSZ/2+8);
            edBtn('+',BX+BSZ+50,BY,BSZ,BSZ,'#00ff44',ph);
            ctx.textAlign='left';
        }
    } else if(editorTab==='settings'){
        const SX=60,SW=500;
        function field(label,key,y,placeholder){
            ctx.font='bold 12px "Courier New"';ctx.fillStyle='#445566';ctx.textAlign='left';ctx.fillText(label,SX,y);
            const foc=editorInputFocus===key;
            ctx.fillStyle=foc?'rgba(0,255,170,0.09)':'rgba(0,0,0,0.5)';ctx.fillRect(SX,y+6,SW,38);
            ctx.strokeStyle=foc?'#00ffaa':'#223344';ctx.lineWidth=foc?2:1;ctx.strokeRect(SX,y+6,SW,38);
            const val=editorLevel[key]||'';
            ctx.fillStyle=val?'#eeffee':'#334455';ctx.font='bold 15px "Courier New"';
            ctx.fillText(val?(val+(foc&&Math.floor(Date.now()/500)%2===0?'_':'')):placeholder+(foc?'_':''),SX+10,y+31);
        }
        field('NÁZEV LEVELU:','name',CY,'zadej název...');
        field('PŘEZDÍVKA AUTORA:','author',CY+70,'tvoje jméno...');
        // Difficulty
        ctx.font='bold 12px "Courier New"';ctx.fillStyle='#445566';ctx.textAlign='left';ctx.fillText('OBTÍŽNOST:',SX,CY+148);
        const DIFFS=[{id:'easy',l:'EASY',c:'#44ff88'},{id:'medium',l:'MEDIUM',c:'#00ffff'},{id:'hard',l:'HARD',c:'#ff4444'}];
        for(let i=0;i<3;i++){
            const d=DIFFS[i],bx=SX+i*170,by=CY+158,bw=162,bh=50;
            const cur=editorLevel.difficulty===d.id,hov=mouse.x>=bx&&mouse.x<=bx+bw&&mouse.y>=by&&mouse.y<=by+bh;
            ctx.fillStyle=cur?d.c+'20':hov?d.c+'0d':'rgba(0,0,0,0.45)';ctx.fillRect(bx,by,bw,bh);
            ctx.strokeStyle=cur?d.c:hov?d.c+'77':d.c+'25';ctx.lineWidth=cur?2.5:1;ctx.strokeRect(bx,by,bw,bh);
            ctx.fillStyle=cur?d.c:hov?d.c+'bb':d.c+'55';ctx.font=`bold ${cur?17:15}px "Courier New"`;ctx.textAlign='center';
            ctx.fillText(d.l,bx+bw/2,by+bh/2+6);ctx.textAlign='left';
            if(cur){ctx.fillStyle=d.c;ctx.font='9px "Courier New"';ctx.textAlign='center';ctx.fillText('▲ VYBRÁNA',bx+bw/2,by+bh-6);ctx.textAlign='left';}
        }
        // Summary box
        ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(SX,CY+228,SW,60);
        ctx.strokeStyle='#1a2a30';ctx.lineWidth=1;ctx.strokeRect(SX,CY+228,SW,60);
        const tot=editorLevel.waves.reduce((s,w)=>(w.enemies||[]).reduce((ss,e)=>ss+e.count,0)+s,0);
        ctx.fillStyle='#334455';ctx.font='11px "Courier New"';ctx.textAlign='left';
        ctx.fillText(`Vlny: ${editorLevel.waves.length}   Nepřátelé: ${tot}   Zdi: ${editorObsSet.size}  Spiky: ${editorSpikeSet.size}   Mapa: ${MAP_THEMES[editorLevel.mapTheme||0].name}   ${editorLevel.mapCols||36} sl.`,SX+10,CY+250);
        ctx.fillStyle='#224433';ctx.font='10px "Courier New"';
        ctx.fillText('Překážky se editují v záložce MAPA. Vše se ukládá automaticky.',SX+10,CY+270);
    }
    ctx.shadowBlur=0;
}

function handleEditorClick(cx,cy){
    // ── Shared layout constants (must match drawEditor) ───────────────────────
    const BOT=canvas.height-48;
    const TOP=50;
    const TW=180,TH=34,TY=TOP,TSX=canvas.width/2-3*TW/2;
    const CY=TOP+TH+10; // content area top = 94

    // ── MAP TAB ──────────────────────────────────────────────────────────────
    if(editorTab==='map'){
        // Theme swatch click (top bar)
        const swW=28,swH=20,swY=14,swGap=3,swStartX=canvas.width-10*(swW+swGap)-60;
        for(let i=0;i<10;i++){
            const sx=swStartX+i*(swW+swGap);
            if(cx>=sx&&cx<=sx+swW&&cy>=swY&&cy<=swY+swH){editorLevel.mapTheme=i;return;}
        }
        // Scroll ◀ button
        const scBx=8,scBy=22,scBw=22,scBh=22;
        if(cx>=scBx&&cx<=scBx+scBw&&cy>=scBy&&cy<=scBy+scBh){
            editorMapScrollCol=Math.max(0,editorMapScrollCol-1);return;
        }
        // Scroll ▶ button
        const scRBx=scBx+scBw+90;
        if(cx>=scRBx&&cx<=scRBx+scBw&&cy>=scBy&&cy<=scBy+scBh){
            const mapCols=editorLevel.mapCols||36;
            editorMapScrollCol=Math.min(Math.max(0,mapCols-GCOLS),editorMapScrollCol+1);return;
        }
        // + Extend button
        const exBx=scRBx+scBw+8,exBw=120;
        if(cx>=exBx&&cx<=exBx+exBw&&cy>=scBy&&cy<=scBy+scBh){
            editorLevel.mapCols=(editorLevel.mapCols||36)+GCOLS;
            editorMsg=`✓ Mapa rozšířena na ${editorLevel.mapCols} sloupců (${editorLevel.mapCols*CELL/canvas.width}× šířka obrazovky)`;
            editorMsgTimer=180;return;
        }
        // Bottom bar: ZPĚT button
        const bkBx=10,bkBw=120,bkBh=32,bkBy=BOT+8;
        if(cx>=bkBx&&cx<=bkBx+bkBw&&cy>=bkBy&&cy<=bkBy+bkBh){editorTab='waves';return;}
        // Tool selector buttons
        const tBh=32,tBy=BOT+8;
        if(cx>=140&&cx<=220&&cy>=tBy&&cy<=tBy+tBh){editorMapTool='obstacles';return;}
        if(cx>=228&&cx<=308&&cy>=tBy&&cy<=tBy+tBh){editorMapTool='spike';return;}
        if(cx>=316&&cx<=406&&cy>=tBy&&cy<=tBy+tBh){editorMapTool='spawn';return;}
        if(cx>=414&&cx<=484&&cy>=tBy&&cy<=tBy+tBh){editorMapTool='player';return;}
        // Gravity toggle
        const grBx=492,grBw=118,grBh=32,grBy=BOT+8;
        if(cx>=grBx&&cx<=grBx+grBw&&cy>=grBy&&cy<=grBy+grBh){
            editorLevel.gravity=!editorLevel.gravity;
            editorMsg=editorLevel.gravity?'🌍 Gravitace ZAP — hráč skáče na platformách':'⬆ Gravitace VYP — volný pohyb';
            editorMsgTimer=150; return;
        }
        // SMAŽ / DELETE button (context-sensitive)
        const clBx=618,clBw=110,clBh=32,clBy=BOT+8;
        if(cx>=clBx&&cx<=clBx+clBw&&cy>=clBy&&cy<=clBy+clBh){
            if(editorMapTool==='spawn'){editorLevel.spawnPoints=[];editorMsg='✓ Spawn body nepřátel smazány';editorMsgTimer=120;}
            else if(editorMapTool==='player'){editorLevel.playerSpawn=null;editorMsg='✓ Hráčský spawn smazán';editorMsgTimer=120;}
            else if(editorMapTool==='spike'){editorSpikeSet.clear();editorMsg='✓ Všechny spiky smazány';editorMsgTimer=120;}
            else{editorObsSet.clear();editorMsg='✓ Všechny zdi smazány';editorMsgTimer=120;}
            return;
        }
        // Grid click — handled in mousedown drag
        return;
    }

    // ── TAB BAR (waves / map / settings) ─────────────────────────────────────
    const TABS=['waves','map','settings'];
    for(let i=0;i<TABS.length;i++){
        const tx=TSX+i*TW;
        if(cx>=tx&&cx<=tx+TW&&cy>=TY&&cy<=TY+TH){
            editorTab=TABS[i];editorInputFocus=null;return;
        }
    }

    // ── BOTTOM ACTION BAR (always visible on waves/settings) ─────────────────
    // BACK → community browser
    if(cx>=10&&cx<=100&&cy>=BOT+8&&cy<=BOT+40){state='community';editorInputFocus=null;return;}
    // TEST button
    const TB={x:canvas.width-216,y:BOT+7,w:100,h:34};
    if(cx>=TB.x&&cx<=TB.x+TB.w&&cy>=TB.y&&cy<=TB.y+TB.h){
        if(!editorLevel.name.trim()){editorMsg='⚠ Zadej název levelu!';editorMsgTimer=120;return;}
        if(editorLevel.waves.length===0){editorMsg='⚠ Přidej aspoň 1 vlnu!';editorMsgTimer=120;return;}
        const testLv={...editorLevel,id:'test',obstacles:editorObsToArray(),plays:0};
        startCommunityLevel(testLv);
        editorTestMode = true; lastEditorTestMode = true;
        return;
    }
    // UPLOAD button
    const UB={x:canvas.width-108,y:BOT+7,w:100,h:34};
    if(cx>=UB.x&&cx<=UB.x+UB.w&&cy>=UB.y&&cy<=UB.y+UB.h){
        if(!editorLevel.name.trim()){editorMsg='⚠ Zadej název levelu!';editorMsgTimer=120;return;}
        if(!editorLevel.author.trim()){editorTab='settings';editorInputFocus='author';editorMsg='⚠ Zadej přezdívku!';editorMsgTimer=120;return;}
        if(editorLevel.waves.length===0){editorMsg='⚠ Přidej aspoň 1 vlnu!';editorMsgTimer=120;return;}
        editorMsg='Nahrávám...';editorMsgTimer=9999;
        const uploadData={...editorLevel,obstacles:editorObsToArray()};
        fbUploadLevel(uploadData).then(id=>{
            if(id){editorMsg='✓ Level nahrán! ID: '+id;editorMsgTimer=300;fbLoadLevels(true);}
            else{editorMsg='✗ Chyba nahrávání';editorMsgTimer=180;}
        });
        return;
    }

    // ── WAVES TAB ─────────────────────────────────────────────────────────────
    if(editorTab==='waves'){
        const LX=10,LW=255,RH=50;
        const maxWaves=Math.floor((BOT-CY-40)/RH);
        // Wave rows
        for(let wi=0;wi<Math.min(editorLevel.waves.length,maxWaves);wi++){
            const wy=CY+20+wi*RH;
            // Delete × button
            const DX=LX+LW-26,DY=wy+13;
            if(cx>=DX&&cx<=DX+18&&cy>=DY&&cy<=DY+18){
                editorLevel.waves.splice(wi,1);
                if(editorSelWave>=editorLevel.waves.length)editorSelWave=Math.max(0,editorLevel.waves.length-1);
                return;
            }
            // Select wave row
            if(cx>=LX&&cx<=LX+LW&&cy>=wy&&cy<=wy+RH-4){editorSelWave=wi;return;}
        }
        // + Add wave button
        const AWY=CY+20+Math.min(editorLevel.waves.length,maxWaves)*RH;
        if(cx>=LX&&cx<=LX+LW&&cy>=AWY&&cy<=AWY+34){
            editorLevel.waves.push({enemies:[{type:'basic',count:5}]});
            editorSelWave=editorLevel.waves.length-1;
            return;
        }
        // Enemy +/- buttons (right panel)
        editorEnsureWave();
        const BX=canvas.width-180,BSZ=36;
        const types=['basic','fast','tank','shooter'];
        for(let ti=0;ti<types.length;ti++){
            const tp=types[ti];
            let eg=editorLevel.waves[editorSelWave].enemies.find(e=>e.type===tp);
            if(!eg){eg={type:tp,count:0};editorLevel.waves[editorSelWave].enemies.push(eg);}
            const EY=CY+22+ti*66,BY=EY+6;
            // − button
            if(cx>=BX&&cx<=BX+BSZ&&cy>=BY&&cy<=BY+BSZ){eg.count=Math.max(0,eg.count-1);return;}
            // + button
            const PX=BX+BSZ+50;
            if(cx>=PX&&cx<=PX+BSZ&&cy>=BY&&cy<=BY+BSZ){eg.count=Math.min(30,eg.count+1);return;}
        }

    // ── SETTINGS TAB ─────────────────────────────────────────────────────────
    } else if(editorTab==='settings'){
        const SX=60,SW=500;
        // Name field click
        if(cx>=SX&&cx<=SX+SW&&cy>=CY+6&&cy<=CY+44){editorInputFocus='name';return;}
        // Author field click
        if(cx>=SX&&cx<=SX+SW&&cy>=CY+76&&cy<=CY+114){editorInputFocus='author';return;}
        editorInputFocus=null;
        // Difficulty buttons
        const DIFFS=['easy','medium','hard'];
        for(let i=0;i<3;i++){
            const bx=SX+i*170,by=CY+158,bw=162,bh=50;
            if(cx>=bx&&cx<=bx+bw&&cy>=by&&cy<=by+bh){editorLevel.difficulty=DIFFS[i];return;}
        }
    }
}

// ─── Community browser ────────────────────────────────────────────────────────
function drawCommunityBrowser(){
    ctx.fillStyle='rgba(0,3,14,0.98)';ctx.fillRect(0,0,canvas.width,canvas.height);
    // Header
    ctx.textAlign='center';ctx.font='bold 26px "Courier New"';ctx.shadowBlur=16;ctx.shadowColor='#00ffaa';ctx.fillStyle='#00ffaa';
    ctx.fillText('🌐  COMMUNITY LEVELS',canvas.width/2,42);ctx.shadowBlur=0;
    ctx.font='12px "Courier New"';ctx.fillStyle='#446655';
    ctx.fillText('Levely od ostatních hráčů — klikni pro zahraní',canvas.width/2,66);

    if(fbLoading && fbLevels.length===0){
        ctx.font='18px "Courier New"';ctx.fillStyle='#00ffaa88';ctx.textAlign='center';
        ctx.fillText('Načítám...',canvas.width/2,canvas.height/2);
        return;
    }
    if(fbError){
        ctx.font='14px "Courier New"';ctx.fillStyle='#ff4444';ctx.textAlign='center';
        ctx.fillText(fbError,canvas.width/2,canvas.height/2);
        ctx.font='12px "Courier New"';ctx.fillStyle='#556677';
        ctx.fillText('Zkontroluj připojení k internetu',canvas.width/2,canvas.height/2+24);
        return;
    }
    if(fbLevels.length===0){
        ctx.font='16px "Courier New"';ctx.fillStyle='#446655';ctx.textAlign='center';
        ctx.fillText('Zatím žádné levely 😢',canvas.width/2,canvas.height/2-20);
        ctx.font='13px "Courier New"';ctx.fillStyle='#334455';
        ctx.fillText('Buď první kdo nahraje level!',canvas.width/2,canvas.height/2+10);
        // Still draw the create button and back text even when empty
        const cbx2=canvas.width-170,cby2=canvas.height-50,cbw2=158,cbh2=34;
        const chov2=mouse.x>=cbx2&&mouse.x<=cbx2+cbw2&&mouse.y>=cby2&&mouse.y<=cby2+cbh2;
        ctx.fillStyle=chov2?'rgba(255,200,0,0.2)':'rgba(0,0,0,0.6)';ctx.fillRect(cbx2,cby2,cbw2,cbh2);
        ctx.strokeStyle=chov2?'#ffcc00':'#ffcc0077';ctx.lineWidth=chov2?2:1;ctx.strokeRect(cbx2,cby2,cbw2,cbh2);
        if(chov2){ctx.shadowBlur=10;ctx.shadowColor='#ffcc00';}
        ctx.fillStyle=chov2?'#ffcc00':'#ffcc00aa';ctx.font='bold 13px "Courier New"';ctx.textAlign='center';
        ctx.fillText('✏ VYTVOŘIT LEVEL',cbx2+cbw2/2,cby2+22);ctx.shadowBlur=0;
        ctx.font='11px "Courier New"';ctx.fillStyle='#334455';
        ctx.fillText('ESC nebo klik sem pro návrat do menu',canvas.width/2,canvas.height-10);
        return;
    }

    // Level list
    const startY=90, rowH=52, visible=9;
    const shown=fbLevels.slice(communityScroll, communityScroll+visible);
    shown.forEach((lv,i)=>{
        const rx=40, ry=startY+i*rowH, rw=canvas.width-80, rh=rowH-6;
        const hov=mouse.x>=rx&&mouse.x<=rx+rw&&mouse.y>=ry&&mouse.y<=ry+rh;
        ctx.fillStyle=hov?'rgba(0,255,170,0.08)':'rgba(0,20,14,0.6)';ctx.fillRect(rx,ry,rw,rh);
        ctx.strokeStyle=hov?'#00ffaa':'#00ffaa33';ctx.lineWidth=hov?1.5:1;ctx.strokeRect(rx,ry,rw,rh);
        // Difficulty badge
        const dc={easy:'#44ff88',medium:'#00ffff',hard:'#ff4444'};
        const dcol=dc[lv.difficulty]||'#aaaaaa';
        ctx.fillStyle=dcol;ctx.font='bold 10px "Courier New"';ctx.textAlign='left';
        ctx.fillText((lv.difficulty||'?').toUpperCase(),rx+10,ry+15);
        // Name
        if(hov){ctx.shadowBlur=8;ctx.shadowColor='#00ffaa';}
        ctx.fillStyle=hov?'#00ffaa':'#ccffee';ctx.font=`bold 15px "Courier New"`;
        ctx.fillText(lv.name||'Bez názvu',rx+10,ry+32);ctx.shadowBlur=0;
        // Author + stats
        ctx.fillStyle='#446655';ctx.font='10px "Courier New"';
        ctx.fillText(`autor: ${lv.author||'?'}   ·   vlny: ${(lv.waves||[]).length}   ·   zahráno: ${lv.plays||0}×`,rx+10,ry+46);
        // Progress (community)
        const cprog=levelProgress[lv.id];
        if(cprog){
            if(cprog.completed){
                ctx.fillStyle='#44ff88';ctx.font='bold 10px "Courier New"';ctx.textAlign='right';
                ctx.shadowBlur=5;ctx.shadowColor='#44ff88';
                ctx.fillText('✓ HOTOVO',rx+rw-34,ry+20);ctx.shadowBlur=0;
            }
            if(cprog.highScore>0){
                ctx.fillStyle='#ffcc00';ctx.font='9px "Courier New"';ctx.textAlign='right';
                ctx.fillText('MAX: '+cprog.highScore,rx+rw-34,ry+35);
            }
        }
        // Arrow
        ctx.fillStyle=hov?'#00ffaa':'#334455';ctx.font='18px "Courier New"';ctx.textAlign='right';
        ctx.fillText('▶',rx+rw-10,ry+rh/2+6);
    });

    // Scroll buttons
    if(communityScroll>0){
        const bx=canvas.width/2-50,by=startY-32,bw=100,bh=24;
        const hov=mouse.x>=bx&&mouse.x<=bx+bw&&mouse.y>=by&&mouse.y<=by+bh;
        ctx.fillStyle=hov?'rgba(0,255,170,0.15)':'rgba(0,0,0,0.4)';ctx.fillRect(bx,by,bw,bh);
        ctx.strokeStyle='#00ffaa55';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
        ctx.fillStyle='#00ffaa';ctx.font='bold 12px "Courier New"';ctx.textAlign='center';ctx.fillText('▲ Výš',bx+bw/2,by+16);
    }
    const maxScroll=Math.max(0,fbLevels.length-visible);
    if(communityScroll<maxScroll||fbLoading){
        const bx=canvas.width/2-50,by=startY+visible*rowH+6,bw=100,bh=24;
        const hov=mouse.x>=bx&&mouse.x<=bx+bw&&mouse.y>=by&&mouse.y<=by+bh;
        ctx.fillStyle=hov?'rgba(0,255,170,0.15)':'rgba(0,0,0,0.4)';ctx.fillRect(bx,by,bw,bh);
        ctx.strokeStyle='#00ffaa55';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
        ctx.fillStyle=fbLoading?'#446655':'#00ffaa';ctx.font='bold 12px "Courier New"';ctx.textAlign='center';
        ctx.fillText(fbLoading?'...':(communityScroll<maxScroll?'▼ Víc':'▼ Načíst víc'),bx+bw/2,by+16);
    }

    // CREATE LEVEL button (bottom right)
    const cbx2=canvas.width-170,cby2=canvas.height-50,cbw2=158,cbh2=34;
    const chov2=mouse.x>=cbx2&&mouse.x<=cbx2+cbw2&&mouse.y>=cby2&&mouse.y<=cby2+cbh2;
    ctx.fillStyle=chov2?'rgba(255,200,0,0.2)':'rgba(0,0,0,0.6)';ctx.fillRect(cbx2,cby2,cbw2,cbh2);
    ctx.strokeStyle=chov2?'#ffcc00':'#ffcc0077';ctx.lineWidth=chov2?2:1;ctx.strokeRect(cbx2,cby2,cbw2,cbh2);
    if(chov2){ctx.shadowBlur=10;ctx.shadowColor='#ffcc00';}
    ctx.fillStyle=chov2?'#ffcc00':'#ffcc00aa';ctx.font='bold 13px "Courier New"';ctx.textAlign='center';
    ctx.fillText('✏ VYTVOŘIT LEVEL',cbx2+cbw2/2,cby2+22);ctx.shadowBlur=0;

// ─── Background bot (menu animation) ──────────────────────────────────────────
function drawMenuBot(){
    const t=frameCount*0.012;
    // Bot position: slow figure-8
    const bx=canvas.width/2+Math.cos(t*0.7)*220;
    const by=canvas.height/2+Math.sin(t*1.3)*120;
    const ba=frameCount*0.04; // angle
    // Enemies
    const bEnems=[
        {x:canvas.width*0.15+Math.cos(t*1.1+0)*80,  y:canvas.height*0.3+Math.sin(t*0.8+0)*60,  c:'#ff0088',s:26},
        {x:canvas.width*0.82+Math.cos(t*0.9+2)*70,  y:canvas.height*0.65+Math.sin(t*1.2+1)*55, c:'#ffee00',s:20},
        {x:canvas.width*0.5+Math.cos(t*1.3+4)*160,  y:canvas.height*0.78+Math.sin(t*0.7+3)*40, c:'#ff4400',s:36},
        {x:canvas.width*0.3+Math.cos(t*0.6+1)*90,   y:canvas.height*0.2+Math.sin(t*1.5+2)*50,  c:'#00ddff',s:38},
        {x:canvas.width*0.75+Math.cos(t*1.4+3)*110, y:canvas.height*0.22+Math.sin(t*0.9+4)*70, c:'#ff0088',s:22},
    ];
    ctx.save();ctx.globalAlpha=0.28;
    // Draw bot "bullets"
    const bulletA=Math.atan2(bEnems[0].y-by,bEnems[0].x-bx);
    for(let bi=0;bi<3;bi++){
        const blt=((frameCount+bi*20)%60)/60;
        const blx=bx+Math.cos(bulletA)*blt*250,bly=by+Math.sin(bulletA)*blt*250;
        ctx.fillStyle='#00ffff';ctx.beginPath();ctx.arc(blx,bly,3,0,Math.PI*2);ctx.fill();
    }
    // Draw enemies
    for(const e of bEnems){
        const ea=Math.atan2(by-e.y,bx-e.x)+frameCount*0.03;
        ctx.strokeStyle=e.c;ctx.lineWidth=2.5;ctx.shadowBlur=12;ctx.shadowColor=e.c;
        ctx.beginPath();ctx.arc(e.x,e.y,e.s,0,Math.PI*2);ctx.stroke();
        ctx.beginPath();ctx.moveTo(e.x+Math.cos(ea)*e.s,e.y+Math.sin(ea)*e.s);
        ctx.lineTo(e.x+Math.cos(ea+0.4)*(e.s-8),e.y+Math.sin(ea+0.4)*(e.s-8));
        ctx.lineTo(e.x+Math.cos(ea-0.4)*(e.s-8),e.y+Math.sin(ea-0.4)*(e.s-8));
        ctx.closePath();ctx.fill();
        ctx.shadowBlur=0;
    }
    // Draw bot player (small cyan robot)
    ctx.shadowBlur=18;ctx.shadowColor='#00ffff';ctx.strokeStyle='#00ffff';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(bx,by,18,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(0,255,255,0.15)';ctx.beginPath();ctx.arc(bx,by,18,0,Math.PI*2);ctx.fill();
    // Bot gun barrel
    const ga=Math.atan2(bEnems[0].y-by,bEnems[0].x-bx);
    ctx.beginPath();ctx.moveTo(bx+Math.cos(ga)*12,by+Math.sin(ga)*12);
    ctx.lineTo(bx+Math.cos(ga)*26,by+Math.sin(ga)*26);ctx.stroke();
    // Bot eyes
    ctx.fillStyle='#00ffff';ctx.shadowBlur=0;
    ctx.beginPath();ctx.arc(bx+Math.cos(ga-0.4)*9,by+Math.sin(ga-0.4)*9,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(bx+Math.cos(ga+0.4)*9,by+Math.sin(ga+0.4)*9,3,0,Math.PI*2);ctx.fill();
    ctx.restore();
}

// ─── Main loop ────────────────────────────────────────────────────────────────
function loop(){
    frameCount++;
    // Detect playing → gameover/victory transitions and save progress
    if(_prevState==='playing'||_prevState==='minigame'){
        if(state==='gameover'){ saveLevelProgress(false); tutorialStep=-1; }
        else if(state==='victory') saveLevelProgress(true);
    }
    _prevState=state;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawBackground(cameraX);

    if (state==='editor') {
        handleEditorClick._hovered=true;
        drawEditor();
        canvas.style.cursor=editorTab==='map'?'crosshair':'default';
    } else if (state==='playing') {
        update();
        const _camRound=Math.round(cameraX);
        if(_camRound){ctx.save();ctx.translate(-_camRound,0);}
        drawObstacles();
        drawPowerups();drawParticles();drawBullets();drawFloatingTexts();
        for(const e of enemies)drawEnemy(e);
        if(boss)drawBoss();
        drawPlayer();
        if(_camRound)ctx.restore();
        drawHUD();drawMapTransition();drawMobileControls();
        // Community level wave bar + progress
        if(communityLevel){
            const tw=communityLevel.waves.length,cw=communityWave;
            ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(canvas.width/2-100,canvas.height-22,200,14);
            for(let i=0;i<tw;i++){const wx=canvas.width/2-100+i*(200/tw);ctx.fillStyle=i<cw?'#00ffaa':i===cw?'#00ffaa88':'#223344';ctx.fillRect(wx+1,canvas.height-21,200/tw-2,12);}
            ctx.textAlign='center';ctx.font='9px "Courier New"';ctx.fillStyle='#aaffee';ctx.fillText(`VLNA ${cw+1}/${tw}`,canvas.width/2,canvas.height-10);
            // Level progress bar (when map is wider than screen)
            const lvW=(communityLevel.mapCols||GCOLS)*CELL;
            if(lvW>canvas.width){
                ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(10,canvas.height-8,canvas.width-20,4);
                ctx.fillStyle='#00ffaa88';ctx.fillRect(10,canvas.height-8,Math.max(0,(player.x/lvW)*(canvas.width-20)),4);
            }
        }
        canvas.style.cursor='crosshair';
    } else if (state==='minigame') {
        // Frozen game beneath
        drawPowerups();drawParticles();drawBullets();
        for(const e of enemies)drawEnemy(e);
        if(boss)drawBoss();
        drawPlayer();
        updateMiniGame();
        drawMiniGame();
        canvas.style.cursor='crosshair';
    } else if (state==='paused') {
        const _camRoundP=Math.round(cameraX);
        if(_camRoundP){ctx.save();ctx.translate(-_camRoundP,0);}
        drawObstacles();
        drawPowerups();drawParticles();drawBullets();
        for(const e of enemies)drawEnemy(e);
        if(boss)drawBoss();
        drawPlayer();
        if(_camRoundP)ctx.restore();
        drawHUD();drawMobileControls();
        drawPauseMenu();
    } else if (state==='quitting') {
        drawQuitting();
        canvas.style.cursor='default';
    } else if (state==='levelSelect') {
        drawLevelSelect();
        canvas.style.cursor='default';
    } else if (state==='community') {
        drawCommunityBrowser();
        canvas.style.cursor='default';
    } else {
        drawOverlay();
        canvas.style.cursor='default';
    }
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
